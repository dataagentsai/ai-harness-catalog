<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AHC Specs Explained</title>
<style>
:root{
  --paper:#F4F3EE; --surface:#FFFFFC; --sunk:#EAE9E2;
  --ink:#16191A; --ink-2:#4F5655; --ink-3:#848B89;
  --rule:#D8D7CE; --rule-2:#BDBCB2;
  --accent:#2B5A8A; --accent-soft:#DDE7F2;
  --ok:#2D6E4E; --ok-soft:#DCEDE3;
  --no:#A63C24; --no-soft:#F6E0D9;
  --wa:#8C6508; --wa-soft:#F4EAD0;
  --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101313; --surface:#171B1B; --sunk:#131716;
  --ink:#E7EAE6; --ink-2:#A6AEAA; --ink-3:#77807C;
  --rule:#2A302E; --rule-2:#39413E;
  --accent:#8DB8E0; --accent-soft:#1B2733;
  --ok:#7CC39E; --ok-soft:#18291F;
  --no:#E98F74; --no-soft:#301B15;
  --wa:#D8AE4A; --wa-soft:#2B2413;
}}
:root[data-theme="dark"]{
  --paper:#101313; --surface:#171B1B; --sunk:#131716;
  --ink:#E7EAE6; --ink-2:#A6AEAA; --ink-3:#77807C;
  --rule:#2A302E; --rule-2:#39413E;
  --accent:#8DB8E0; --accent-soft:#1B2733;
  --ok:#7CC39E; --ok-soft:#18291F;
  --no:#E98F74; --no-soft:#301B15;
  --wa:#D8AE4A; --wa-soft:#2B2413;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 80px}
a{color:var(--accent)}
h1{font:600 30px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
h2{font:600 21px/1.3 var(--serif);margin:48px 0 12px}
.lede{color:var(--ink-2);margin:0 0 24px;max-width:62ch}
.mono{font-family:var(--mono)}

/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#q{flex:1;min-width:200px;font:15px var(--sans);padding:9px 12px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
.toggle{font-size:14px;color:var(--ink-2);display:flex;gap:6px;align-items:center;cursor:pointer}
.count{font-size:13px;color:var(--ink-3)}
ul.specs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ul.specs li a{display:flex;gap:12px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
ul.specs li a:hover{background:var(--sunk)}
ul.specs li.grp{display:flex;gap:10px;align-items:baseline;padding:28px 6px 8px;border-bottom:2px solid var(--rule-2)}
ul.specs li.grp:first-child{padding-top:12px}
ul.specs .gn{font:600 18px var(--serif)}
ul.specs .gd{flex:1;color:var(--ink-2);font-size:14px}
ul.specs .gc{font-size:13px;color:var(--ink-3)}
ul.specs .id{font:13px var(--mono);color:var(--ink-3);flex:none;width:76px}
ul.specs .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:600 11px/1 var(--sans);letter-spacing:.04em;padding:4px 6px;border-radius:4px;flex:none}
.MUST{color:var(--no);background:var(--no-soft)} .SHOULD{color:var(--wa);background:var(--wa-soft)} .MAY{color:var(--ink-2);background:var(--sunk)}
.pic{color:var(--ok);background:var(--ok-soft)}
.na{color:var(--ink-3);border:1px solid var(--rule-2);background:transparent}
@media (max-width:560px){ul.specs .tt{white-space:normal}}

/* detail */
.back{display:inline-block;margin-bottom:24px;font-size:14px;text-decoration:none}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink-3)}
.oneline{font:19px/1.5 var(--serif);background:var(--accent-soft);border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin:20px 0}
figure{margin:20px 0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;overflow-x:auto}
figure svg{display:block;width:100%;min-width:560px;height:auto}
figcaption{font-size:14px;color:var(--ink-2);margin-top:10px}
svg text{font-family:var(--sans);fill:var(--ink)}
svg .t2{fill:var(--ink-2)} svg .t3{fill:var(--ink-3)}
svg .tok{fill:var(--ok)} svg .tno{fill:var(--no)} svg .tac{fill:var(--accent)} svg .twa{fill:var(--wa)}
svg .m{font-family:var(--mono)}
svg .bx{fill:var(--surface);stroke:var(--rule-2);stroke-width:1.5}
svg .sk{fill:var(--sunk);stroke:var(--rule-2);stroke-width:1.5}
svg .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
svg .no{fill:var(--no-soft);stroke:var(--no);stroke-width:1.5}
svg .ac{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg .wa{fill:var(--wa-soft);stroke:var(--wa);stroke-width:1.5}
svg .dash{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:6 5}
svg .ln{fill:none;stroke:var(--ink-2);stroke-width:1.8}
svg .lnok{fill:none;stroke:var(--ok);stroke-width:1.8}
svg .lnno{fill:none;stroke:var(--no);stroke-width:1.8}
svg .axis{fill:none;stroke:var(--rule-2);stroke-width:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px}
.card h3{margin:0 0 6px;font:600 16px var(--sans)}
.card p{margin:0;color:var(--ink-2);font-size:15px}
.card.bad{border-color:var(--no);background:var(--no-soft)}
.card.good{border-color:var(--ok);background:var(--ok-soft)}
.big{font-size:40px;line-height:1;margin-bottom:8px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--paper);display:grid;place-items:center;font-weight:600}
.steps .say{font-family:var(--mono);font-size:13.5px;background:var(--sunk);padding:2px 6px;border-radius:4px}
.q{margin:14px 0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px}
.q .ask{font-weight:600;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule-2);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink-2);background:var(--paper)}
.chip.pick{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);font-weight:600}
.q .ans{margin-top:10px;color:var(--ink-2);font-size:15px}
.q .open{color:var(--wa)}
.spectrum{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok),var(--wa),var(--no));margin:8px 0 12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.three,.four{grid-template-columns:1fr 1fr}}
.verdict{font-size:13px;font-weight:600;margin-top:8px}
.quiz{display:grid;gap:10px}
.quiz button{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.quiz button:hover{border-color:var(--rule-2)}
.quiz button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz .res{display:none;margin-top:8px;font-size:15px}
.quiz button.shown .res{display:block}
.quiz .hint{font-size:12px;color:var(--ink-3)}
.mock{max-width:420px;margin:0 auto;background:var(--paper);border:1px solid var(--rule-2);border-radius:12px;padding:16px;font-size:14.5px}
.mock .row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--rule);padding:6px 0}
.mock .row span:first-child{color:var(--ink-3)}
.mock .btns{display:flex;gap:8px;margin-top:14px}
.mock .btns span{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:600}
.mock .yes{background:var(--ok);color:var(--paper)} .mock .nop{border:1px solid var(--rule-2);color:var(--ink-2)}
details{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details p{color:var(--ink-2);font-size:15px}
.see a{margin-right:10px;font:14px var(--mono)}
.nav{display:flex;justify-content:space-between;margin-top:48px;font-size:14px}
.note{background:var(--wa-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px;margin:18px 0}
.prose p{max-width:66ch}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker>
<marker id="ahok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok)"/></marker>
<marker id="ahno" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--no)"/></marker>
</defs></svg>
<div class="wrap" id="app"></div>

<script>
const SPECS = [{"id":"AHC-0001","t":"Every model response crosses a typed boundary","lv":"MUST","ly":["L6"],"c":"reliability","r":"No model output reaches business logic as an unparsed string. A single parse-and-validate step sits between the provider response and the caller, producing either a typed value or a typed failure. The failure is a declared return shape that callers must handle, not an exception raised from wherever the parse happened to fail.","f":"Without it, malformed output propagates as far as the first component that assumes structure, and surfaces as a KeyError three layers away from the model call that caused it. Teams then add defensive parsing at each consumer, which is the same validation written five times with five different opinions about what to do on failure.","a6":true},{"id":"AHC-0002","t":"Context assembly is one inspectable function","lv":"MUST","ly":["L1"],"c":"maintainability","r":"The bytes sent to the model are produced by a named function from typed inputs, not by string concatenation spread across the call sites. That function is callable on its own, without a provider, and returns the assembled context so it can be inspected. Every segment it emits carries a provenance label distinguishing authored instruction from untrusted material.","f":"Where assembly is scattered, nobody can answer what the model was actually told without running the system and capturing traffic. Prompt changes then arrive as diffs across unrelated files, context growth is invisible until it shows up on an invoice, and the boundary between trusted instruction and retrieved text exists only in the author's head.","a6":true},{"id":"AHC-0003","t":"The running configuration is resolved once and recorded","lv":"MUST","ly":["L15"],"c":"maintainability","r":"Model identifier, prompt version, sampling parameters, tool set and enabled policies are resolved from pinned configuration when the harness is constructed, not read ad hoc at each call site. The resolved set is emitted as a single record that identifies exactly what is running, and the same record is reproducible from a commit plus a configuration reference.","f":"Without a single resolution point, \"which model answered this?\" becomes an archaeology exercise across environment variables, defaults buried in a client library, and a provider alias that silently moved to a new version last Tuesday. Rollback becomes guesswork because nobody can state what the previous configuration was.","a6":true},{"id":"AHC-0004","t":"One choke point for every model call","lv":"MUST","ly":["L2"],"c":"maintainability","r":"Every model invocation in the system passes through a single component. Provider SDKs are constructed in that one place and nowhere else, and the set of reachable models is enumerable from it. Code that calls a provider directly is a defect of the same class as code that opens its own database connection.","f":"Once a second call path exists, every subsequent capability in this catalog acquires a hole. Cost accounting undercounts, spans go missing, the policy point is bypassed, and the model allow-list is advisory. The hole is usually opened by a library, a notebook, or a well-meaning fix under time pressure — and it is discovered by a total that does not reconcile.","a6":true},{"id":"AHC-0005","t":"A declared degradation path for provider failure","lv":"MUST","ly":["L10"],"c":"reliability","r":"For each way the provider can fail — timeout, rate limit, content refusal, malformed response, total outage — the harness has a declared outcome: retry with a bounded policy, fall back to another route, return a defined degraded result, or fail with a typed error. The set is exhaustive, so an unclassified failure has a declared default rather than propagating whatever the client library raised.","f":"Undeclared, these collapse into one generic exception path, and the system responds identically to a rate limit it should have waited out and a content refusal it should never retry. Retrying a refusal burns budget to receive the same answer; not retrying a throttle turns a survivable blip into an outage.","a6":true},{"id":"AHC-0006","t":"One span per call, with context that survives the hops","lv":"MUST","ly":["L11"],"c":"maintainability","r":"The choke point emits a span for every model call, and trace context propagates across every out-of-process boundary the request crosses, including the gateway. Retrieval, tool calls and nested work attach to the same trace, so one identifier reaches the whole of a unit of work. Payload capture, where enabled, happens at a named point with redaction applied before the payload leaves the process.","f":"Without propagation across the proxy hop, traces stop at the application and resume at the provider with a gap in the middle — precisely where routing, caching and fallback decisions were made. Without a single unit-of-work identifier, an agent's fourteen calls appear as fourteen unrelated events, and nobody can reconstruct the trajectory that produced the answer.","a6":true},{"id":"AHC-0007","t":"Spend is accounted to a unit of work, not a call","lv":"MUST","ly":["L13"],"c":"cost","r":"The harness defines a unit of work — a task, a request, a conversation turn — and accumulates tokens and spend against it across every call the unit makes, including retries, judge calls and calls made by nested components. Attribution tags identifying tenant, feature and caller are applied where the unit begins, not at each call site.","f":"Per-call accounting makes an agent that succeeded in one call and one that took forty look identical on a dashboard of averages. Cost per successful task — the only figure that is a business number — becomes uncomputable, and the retries that quietly tripled the bill are counted as separate healthy traffic. Tags applied per call site are missing from whichever call site was added last.","a6":true},{"id":"AHC-0008","t":"One enforcement position, defaulting closed","lv":"MUST","ly":["L7"],"c":"security","r":"Policies applied to traffic — redaction, screening of untrusted content, output filtering — are applied at one named position that every call traverses, not once per application. That position declares, per policy, what happens when the policy machinery itself is unavailable, and the declared default is to refuse rather than to pass traffic through unchecked.","f":"Enforcement duplicated per application drifts within a quarter: each copy is updated on a different schedule, and the one that matters during an incident is the copy nobody remembered existed. Where the open-or-closed behaviour was never declared, a dependency outage silently disables the control, and traffic that should have been refused flows normally with nothing recording that it did.","a6":true},{"id":"AHC-0009","t":"The reachable model set is data, not code","lv":"SHOULD","ly":["L15","L2"],"c":"flexibility","r":"Which models a given caller may reach is configuration resolved at runtime, not a branch in application code. Adding a model, withdrawing one, or restricting a caller to a subset is a change to that configuration and reaches every application at once.","f":"Encoded as code, withdrawing a model becomes a coordinated release across every application that might reference it, which means in practice it does not happen — the withdrawn model stays reachable from the one service nobody remembered. The set of models actually in use then differs from the set anyone believes is in use.","a6":true},{"id":"AHC-0010","t":"A task entrypoint an evaluation can drive","lv":"MUST","ly":["L12"],"c":"maintainability","r":"The system exposes a callable entrypoint that performs one unit of work end to end, without a web server, a queue or a user interface, and returns the typed result together with the trace of how it was produced. The path it exercises is the production path — the same context assembly, the same choke point, the same parsing — parameterised by configuration rather than reimplemented.","f":"Where no such seam exists, an evaluation harness reimplements the pipeline, and thereafter scores a system that resembles production without being it. The reimplementation drifts, and the drift is discovered when a release passes evaluation and fails in production for a reason the evaluation could not have seen. This capability is the one that makes almost every assurance obligation reachable; without it they are aspirations.","a6":true},{"id":"AHC-0011","t":"Untrusted content is fenced and labelled at assembly","lv":"MUST","ly":["L1"],"c":"security","r":"The assembly function distinguishes text the system authored from text it did not — user input, retrieved passages, tool results, file contents — and every segment it emits carries that distinction. Untrusted segments are delimited by a marker the untrusted content itself cannot contain or forge, and the assembled record retains which segments were untrusted.","f":"Without the distinction made structurally, it exists only in the author's head, and the first component to concatenate a retrieved passage into an instruction slot erases it silently. Every downstream control that depends on knowing what was untrusted — screening, attribution, incident reconstruction — then operates on a string in which the boundary is unrecoverable.","a6":true},{"id":"AHC-0012","t":"The token budget is applied by the assembler, and its application is recorded","lv":"MUST","ly":["L1","L13"],"c":"functional-suitability","r":"Context is bounded before the call, by the component that assembles it, using a declared strategy — drop, truncate, summarise or refuse. When the strategy fires, the assembled record states that it fired, which segments it acted on, and how much was removed.","f":"Applied further down, or left to the provider, the boundary is enforced by whatever component happens to notice first, and the usual outcome is a silent truncation of the tail of the retrieved set. The system then answers from a subset of the evidence with no indication that it did, and quality drops for a reason no trace explains.","a6":true},{"id":"AHC-0013","t":"Standing instruction is separable from turn content","lv":"MUST","ly":["L1"],"c":"maintainability","r":"The durable instruction that defines the system's behaviour is held and versioned apart from the material of any individual request. Changing the instruction does not require reconstructing a request, and reconstructing a past request does not require reconstructing the instruction that was in force at the time — the record identifies which version applied.","f":"Fused, the instruction is copied into each call site and drifts between them, so the same system behaves differently depending on which entry point was used. Reconstructing why a past response looked the way it did becomes impossible, because the instruction that produced it has since been edited in place with no version to point at.","a6":true},{"id":"AHC-0014","t":"Sampling parameters are explicit, never inherited","lv":"SHOULD","ly":["L2","L9"],"c":"maintainability","r":"Temperature, top-p, maximum output length, stop sequences and any seed are set explicitly at the choke point and appear in the resolved configuration record. A parameter the system relies on is never left to a client library default or a provider default. Where a model does not accept a parameter at all, the record says the model fixes it, rather than leaving it absent, so a reader can tell a parameter nobody set from one nobody can.","f":"Defaults differ between client libraries, between providers and between versions of the same library, and they change in minor releases. A system that relies on an inherited default has its output variance decided by a dependency upgrade nobody reviewed, and the change surfaces as unexplained inconsistency weeks later.","a6":true},{"id":"AHC-0015","t":"Streaming has a completion and abort contract","lv":"SHOULD","ly":["L2","L6"],"c":"reliability","r":"Where output is streamed, the stream carries an explicit terminal event distinguishing normal completion from abort, refusal and provider failure, and the caller can cancel it such that work downstream actually stops. A stream that simply ends is indistinguishable from a connection that dropped, and the contract must make them distinguishable.","f":"Without a terminal event, a truncated response and a complete one look identical to the consumer, and a system that persists streamed output stores half an answer as though it were whole. Without real cancellation, a user closing the tab leaves the loop running and billing, which is the most common source of spend nobody can account for.","a6":true},{"id":"AHC-0016","t":"Input is validated before any model call is made","lv":"MUST","ly":["L6"],"c":"cost","r":"Requests entering the harness are checked against a declared input type — required fields, size bounds, encoding, and the degenerate cases of empty, whitespace-only and oversized — and rejected at the boundary. No model call is issued for a request the harness could have refused for free.","f":"Unvalidated, an empty string, a nine-megabyte paste and a null field each become a paid model call that returns something confident and useless. Under any kind of automated retry from a caller, this is also the cheapest denial-of-wallet available to anyone who finds the endpoint.","a6":true},{"id":"AHC-0017","t":"The caller receives a discriminated outcome, never a bare value","lv":"MUST","ly":["L6","L10"],"c":"functional-suitability","r":"The harness returns a value that names which of its terminal states occurred — succeeded, refused by policy, abstained for lack of grounds, degraded to a fallback, exhausted a budget, or failed — and the caller cannot read the payload without having handled the discriminator. Each state is reachable by the caller's own code paths.","f":"Where every state returns a string, a policy refusal, an abstention and a real answer are indistinguishable to the consumer, and all three get rendered to the user or written to a database as though they were results. The system that stores \"I don't have enough information to answer that\" as a customer record is the standard symptom.","a6":true},{"id":"AHC-0018","t":"Policy decisions are recorded as events, not side effects","lv":"MUST","ly":["L7","L11"],"c":"security","r":"Every time a policy runs, it emits a record naming the policy, its version, the decision, and what the decision was based on — including when the decision was to allow. The record attaches to the same unit of work as the call it governed.","f":"Where only blocks are recorded, the allow path is invisible, and there is no way to distinguish a policy that examined traffic and passed it from a policy that was disabled, misconfigured or silently erroring. Over-blocking is equally invisible in the other direction: nobody can count refusals of legitimate requests, so the tuning conversation has no data in it and defaults to loosening after the first complaint.","a6":true},{"id":"AHC-0019","t":"Redaction happens before a payload leaves the process","lv":"MUST","ly":["L7","L11"],"c":"security","r":"Prompts and responses are transformed at the point of capture, so that no unredacted copy is written to a queue, an exporter, a log file or a backend. Redaction is a property of the capture path, not a filter applied at read time by whatever reads it.","f":"Redacting at query time means the unredacted copy exists at rest, replicated wherever the telemetry backend replicates, retained for whatever the backend's default retention is, and reachable by everyone with read access to observability. The organisation has then built a searchable archive of customer data, and discovers it during a review rather than a design.","a6":true},{"id":"AHC-0020","t":"Concurrency is bounded by the harness, not by the runtime","lv":"MUST","ly":["L8"],"c":"performance-efficiency","r":"The number of model calls in flight is limited by an explicit control the harness owns, and work beyond that limit queues with a bounded wait rather than being issued. The limit exists whether or not the runtime happens to impose one, and it is expressed in the same unit the provider throttles on.","f":"Where the only limit is how many tasks the runtime will schedule, a burst issues every call at once, the provider throttles, and the retry logic converts one burst into several. Latency then collapses for every caller including the ones who arrived before the burst, and the system's behaviour under load is decided by a thread pool size nobody chose for this purpose.","a6":true},{"id":"AHC-0021","t":"Throttling is handled as a distinct condition from failure","lv":"MUST","ly":["L8","L10"],"c":"reliability","r":"A rate-limit response is classified separately from an error, and drives a different path: wait for the interval the provider indicated, reduce the rate in flight, and only then retry. Any retry after a throttle is spaced with randomised backoff so that concurrent callers do not resume in step.","f":"Collapsed into the generic error path, a throttle is retried immediately, which produces another throttle. Where several callers were throttled at the same moment, they retry at the same moment, and the system converges on a synchronised burst that guarantees the limit stays exceeded. The provider is not down, and the system behaves as though it were.","a6":true},{"id":"AHC-0022","t":"Provider interaction is substitutable without changing the system","lv":"MUST","ly":["L9","L12"],"c":"maintainability","r":"The choke point can be given a substitute that returns recorded or synthetic responses, selected by configuration, with no change to the code above it. The substitute exercises the same parsing, the same policy path and the same outcome types as the live route.","f":"Without a seam, every check of the surrounding logic needs a live call, which makes the fast feedback loop slow and expensive enough that it stops being run. Teams then reach for a substitute that bypasses parsing and policy, and the plumbing they most wanted to exercise is the part the substitute skipped.","a6":true},{"id":"AHC-0023","t":"Recorded fixtures carry a capture date and a re-cut path","lv":"SHOULD","ly":["L9"],"c":"maintainability","r":"Every recorded provider response stores the date it was captured and the resolved configuration that produced it, and there is a single command that re-captures the set against the current configuration. Age is visible wherever the fixtures are used.","f":"Recordings rot invisibly. A fixture captured against a model version that has since been retired keeps passing forever, because it is a recording of itself — it will never disagree with what it recorded. The suite stays green while describing behaviour the system no longer has, which is worse than having no suite, since it is now producing false assurance on a schedule.","a6":true},{"id":"AHC-0024","t":"Retries are bounded, attributed and visible","lv":"MUST","ly":["L10","L13"],"c":"cost","r":"A retry count exists per unit of work, not per call site, and it is bounded. Every attempt is counted against the unit's token and spend accumulation, and the number of attempts appears on the unit's record. Nested layers do not each apply their own retry budget on top of one another. A retry is a call repeated because the previous one failed; the calls a unit makes by design — one per loop step — are bounded separately (AHC-0041), and the two bounds are different numbers.","f":"Retries stacked at three layers multiply rather than add: three at the client, three at the harness and three at the gateway is twenty-seven calls for one logical request, and every one of them is billed. Because each layer counts only its own, no single record shows the multiplication, and the spend appears as ordinary traffic volume.","a6":true},{"id":"AHC-0025","t":"Partial results are typed, never silently truncated","lv":"MUST","ly":["L10","L6"],"c":"reliability","r":"Where the harness stops before completing — output length reached, budget exhausted, deadline hit, stream aborted — what it returns is marked as incomplete, states why, and carries whatever was produced separately from a completed result. Incompleteness is a property of the return value, not something a caller infers from the text.","f":"An answer cut off at a token limit reads as a finished answer that happens to end oddly, and downstream systems store it, index it or act on it. The single most damaging version is an artifact producer whose output was truncated mid-statement and remains syntactically valid — the truncation is then indistinguishable from an intended result until something runs it.","a6":true},{"id":"AHC-0026","t":"One identifier spans the whole unit of work","lv":"MUST","ly":["L11"],"c":"maintainability","r":"A single identifier is created where a unit of work begins and is carried by every model call, retrieval, tool call, policy decision and cost record that unit produces, across process and service boundaries. It is the same unit boundary that AHC-0007 accounts spend against.","f":"Without it, the records exist but cannot be joined: the spend is in one system, the spans in another, the policy decisions in a third, and nothing links the fourteen calls that were one task. Every question worth asking in an incident — what did this cost, what did it retrieve, why did it stop — becomes a manual correlation by timestamp, which fails first under concurrency, which is when incidents happen.","a6":true},{"id":"AHC-0027","t":"The record states which route served the call, and why","lv":"MUST","ly":["L11","L2"],"c":"maintainability","r":"Where more than one route can serve a request — several deployments, several providers, a cache, a fallback, a cheaper tier — the record names the route that served it, the reason it was selected, and whether the response came from a cache rather than the model.","f":"Without the route in the record, quality variation caused by a fallback firing looks like the model becoming unreliable, and the team spends the investigation on prompt changes. A cache hit is worse: the record shows a call that never reached a model, so latency, cost and quality figures all describe something that did not happen.","a6":true},{"id":"AHC-0028","t":"Graders are injectable and versioned apart from the system","lv":"MUST","ly":["L12"],"c":"maintainability","r":"The functions that judge an output are supplied to the eval entrypoint rather than compiled into it, and each carries its own version. Changing a grader is a change to the grader's version, distinguishable in the record from a change to the system it grades.","f":"Fused, a score movement has two possible causes and no way to tell them apart — the system improved, or the rubric was edited. Teams resolve this by never touching the graders, which freezes the definition of quality at whatever it was in the first month, or by editing them freely, which makes the score history meaningless. Both are common and both are silent.","a6":true},{"id":"AHC-0029","t":"A production record can become a dataset row without re-keying","lv":"SHOULD","ly":["L12","L11"],"c":"maintainability","r":"What a captured run records and what the eval entrypoint accepts are the same shape, so promoting a real interaction into a curated set is a copy plus an expected value, not a transcription. The promoted row retains a reference back to the run it came from.","f":"Where the shapes differ, promotion is manual, so it happens once during a push and never again. The curated set then freezes at the inputs someone imagined in the first month while the real input distribution moves, and the widening gap is invisible precisely because the set keeps passing.","a6":true},{"id":"AHC-0030","t":"A ceiling exists that can stop work already in flight","lv":"MUST","ly":["L13"],"c":"cost","r":"Spend and token ceilings are checked before each call against the unit's accumulated total, so a unit that crosses its ceiling stops rather than completing and reporting the overage afterwards. The ceiling is enforced by a component in the request path, not by an alert on a dashboard.","f":"A ceiling that is only reported after the fact is a notification, not a control — it tells you what was already spent. The case it exists for is a loop that will consume a month's budget in an afternoon, and by the time an alert fires on an hourly aggregate, the spend has happened and the only remaining lever is switching something off manually.","a6":true},{"id":"AHC-0031","t":"Context size is observable per release, not only per call","lv":"SHOULD","ly":["L13","L1"],"c":"cost","r":"The assembler reports the size of what it produced, broken down by segment class — standing instruction, tool definitions, retrieved material, conversation history — and that breakdown is comparable across releases of the system.","f":"Context grows by accretion: a clause added to the instruction, a tool registered and never removed, a retrieval depth raised for one hard case. Each change is individually reasonable and invisible, and the aggregate is a per-call tax on every request the system will ever serve. Without the breakdown, the growth is discovered as a cost trend with no attributable cause, and the usual response is to blame traffic.","a6":true},{"id":"AHC-0032","t":"Rollback restores prompt, model and policy together","lv":"MUST","ly":["L15"],"c":"maintainability","r":"The unit of rollback is the whole resolved configuration from AHC-0003, not one of its parts. Reverting returns prompt version, model pin, parameters, tool set and policy set to a combination that previously ran together, and the mechanism to do it is one action.","f":"Where the parts roll back independently, a revert produces a combination that has never run anywhere — last week's prompt against this week's model, with a tool that did not exist when the prompt was written. The system is now in a state nobody has seen, during an incident, which is the moment with the least appetite for a novel configuration.","a6":true},{"id":"AHC-0033","t":"What serves traffic is the artifact that was assessed","lv":"MUST","ly":["L15"],"c":"security","r":"The resolved configuration promoted to production is byte-identical to the one that went through the release process, carried forward as an artifact rather than rebuilt from source at the destination. Promotion moves a thing; it does not reconstruct one.","f":"Where each environment resolves its own configuration from source, a default that differs between environments, a registry that returned a newer prompt, or a dependency that floated produces a production configuration that differs from the one assessed — in a way no diff shows, because both were generated from the same commit.","a6":true},{"id":"AHC-0034","t":"The end user's identity reaches every downstream decision","lv":"MUST","ly":["L16"],"c":"security","r":"The identity on whose behalf the system is acting is carried through the harness to every component that makes an access decision — retrieval, tool dispatch, state reads and writes — and those components decide using that identity rather than the service's own. The identity is part of the call, not ambient state a component may or may not consult.","f":"Where components authorise as the service, the system can reach everything any of its users can reach, and the model decides which of it to surface. Retrieval returns documents the requester was never entitled to, and the only thing preventing disclosure is the model choosing not to mention them — which makes an access control out of a request that can be reworded.","a6":true},{"id":"AHC-0035","t":"Secrets never enter assembled context","lv":"MUST","ly":["L16","L1"],"c":"security","r":"Credentials, keys and tokens are held by the components that use them and are never placed into the text sent to the model, including inside tool definitions, tool results, error messages and retrieved material. A tool that needs a credential resolves it at dispatch from its own store, rather than receiving it as an argument the model produced or saw.","f":"A secret that enters context is in the provider's request, in whatever payload capture is enabled, in the conversation state, and in any dataset row later promoted from that run. It is also now something the model can be asked to repeat. The usual route in is an error message from a failing tool that helpfully includes the request it attempted, headers and all.","a6":true},{"id":"AHC-0036","t":"Every tool has a declared argument contract","lv":"MUST","ly":["L3"],"c":"functional-suitability","r":"A tool is registered with a machine-readable description of its arguments — names, types, constraints, which are required — and that same declaration is what the model is shown and what the dispatcher enforces. There is one declaration, not a description written for the model and a signature written for the code.","f":"Where the two drift apart, the model is told about a parameter the dispatcher does not accept, or a required argument the description never mentioned. The model then produces confidently wrong calls forever, and the fix is applied to whichever copy the debugger happened to open. Tool-selection quality degrades for a reason that looks like model behaviour and is actually a stale string.","a6":true},{"id":"AHC-0037","t":"Arguments are validated at dispatch, before the tool runs","lv":"MUST","ly":["L3"],"c":"functional-suitability","r":"The dispatcher checks model-produced arguments against the declared contract and against semantic constraints the type system cannot express — an identifier that must exist, a range that must be ordered, a reference the caller is entitled to — and rejects invalid calls without executing them. A rejection returns to the loop as a usable result, not as a crash.","f":"Unvalidated arguments reach the implementation, which was written expecting a caller that read the documentation. Syntactically valid but semantically wrong arguments are the dangerous case: a well-formed date range with the end before the start, or a well-formed identifier belonging to another tenant. These execute successfully and return a wrong answer the model then presents with full confidence.","a6":true},{"id":"AHC-0038","t":"Tool results are bounded before they enter context","lv":"MUST","ly":["L3","L1"],"c":"functional-suitability","r":"What a tool returns is shaped to a declared size and structure before it is added to context — truncated, summarised, paginated or projected to the fields that matter — and the shaping records what it removed. The bound is set by the harness, not by whatever the tool happened to return.","f":"A query returning ten thousand rows, a file read of an unexpectedly large file, or an endpoint returning a verbose envelope will consume the entire remaining context in one step. The loop then has no room to reason about what it just fetched, and the usual symptom is an agent that reads something successfully and immediately loses the thread of what it was doing.","a6":true},{"id":"AHC-0039","t":"Tools are classified by reversibility, and the class gates dispatch","lv":"MUST","ly":["L3","L14"],"c":"safety","r":"Every tool declares whether it reads, writes reversibly, or writes irreversibly, and the dispatcher treats the classes differently — the irreversible class requires an explicit grant that the model cannot issue to itself. A tool with no declared class is treated as irreversible until one is declared.","f":"Undeclared, every tool is equally available, and the only thing standing between a model and a destructive action is the instruction asking it not to — which is text an attacker can address and a confused agent can rationalise past. The default-open failure is the dangerous one: a tool added without thought about its class inherits whatever the loop already permits.","a6":true},{"id":"AHC-0040","t":"Tool authority is enforced where the tool executes","lv":"MUST","ly":["L3","L16"],"c":"security","r":"The permissions a tool operates under are held by the executing side and scoped to the least it needs, so that removing a tool from the model's view does not change what the credentials behind it could do. The set of tools shown to the model is a usability decision; the set of actions possible is an authorisation decision, and they are enforced in different places.","f":"Where authority lives only in which tools the model was offered, the boundary is a prompt-time list. Anything that reaches the dispatcher by another path — a retried call, a replayed trajectory, an injected instruction that names a tool still registered — executes with whatever the service account holds. Teams discover the gap when a read-only agent turns out to hold write credentials because both tools shared one connection.","a6":true},{"id":"AHC-0041","t":"Budget enforcement outside the model's control","lv":"MUST","ly":["L4"],"c":"cost","r":"Step count, wall-clock time and token spend are counted by the loop itself and checked before each iteration. The limits are not stated in the prompt, and no tool exposed to the model can read or raise them. Termination yields a typed terminal outcome the caller must handle, carrying whatever partial work exists.","f":"A budget expressed as an instruction is a request, and a model under pressure to complete a task will exceed it, rationalise it, or lose track of the count entirely across a long trajectory. Where the only limit is the model's own discipline, the failure is unbounded in both time and money, and it arrives at whatever hour the trigger happened to fire.","a6":true},{"id":"AHC-0042","t":"The loop has a no-progress condition, not only a step ceiling","lv":"MUST","ly":["L4"],"c":"cost","r":"The loop detects that it is repeating — the same tool with the same arguments, an alternation between two states, a sequence of steps that changes nothing observable — and terminates on that condition independently of whether the step ceiling has been reached. Progress is defined by the harness in terms it can observe, not by asking the model whether it is making any.","f":"A step ceiling alone converts an infinite loop into an expensive finite one: the agent repeats the same failing call forty times and stops because it ran out of steps, having spent the entire budget on one mistake. The user waits the full duration to receive nothing, and the record shows a normal budget exhaustion rather than a stuck loop.","a6":true},{"id":"AHC-0043","t":"A tool failure is a loop state, not an exception","lv":"MUST","ly":["L4","L3"],"c":"reliability","r":"When a tool errors, times out or returns nothing, the dispatcher converts that into a structured result the loop feeds back as an ordinary observation, distinguishing a transient failure from a permanent one and an empty result from an error. The loop continues under its existing budget rather than unwinding.","f":"Where a tool error propagates as an exception, one failing dependency ends the whole trajectory, discarding every step of work already paid for — even when the agent had six other ways to make progress. The opposite failure is equally common: an empty result rendered as a bare empty string, which the model reads as \"nothing exists\" rather than \"that query matched nothing\", and confidently reports absence as fact.","a6":true},{"id":"AHC-0044","t":"The trajectory is checkpointed, not held only in memory","lv":"MUST","ly":["L5","L4"],"c":"reliability","r":"After each step, the loop's state — the steps taken, their results, the accumulated budget and the current position — is written somewhere that survives the process. A trajectory can be resumed from its last checkpoint, and can be replayed from the record without re-executing tools that write.","f":"Held only in process memory, a deployment, a crash or a scale-in event during a long trajectory destroys every step of work and every token spent on it, with no way to resume and frequently no record of how far it got. Where the agent had already taken irreversible actions, the system is now in a state nobody can reconstruct: the effects happened and the account of them did not survive.","a6":true},{"id":"AHC-0045","t":"Tool output is re-fenced on the way back into context","lv":"MUST","ly":["L5","L1"],"c":"security","r":"Content returned by a tool re-enters context through the same assembly path as any other untrusted material, carrying the provenance label from AHC-0011. It is never appended directly to the conversation as though the system had authored it, regardless of how trusted the tool itself is.","f":"A tool that reads a web page, a ticket, a file or a database field returns whatever someone else wrote there. Appended unlabelled, that text sits in the same position as the system's own instructions, and an instruction planted in a ticket description is read by the model as coming from the operator. This is the injection path that survives every input filter, because the hostile text never passed through the input.","a6":true},{"id":"AHC-0046","t":"Delegation is a typed handoff, not a prompt convention","lv":"MUST","ly":["L4","L6"],"c":"functional-suitability","r":"Passing work from one agent to another goes through a declared interface with a named target, a typed payload and a typed return, dispatched by the harness. Which agent receives the work is a decision the harness executes, not a string the model emits and another component parses back out of prose.","f":"Where delegation is a convention — a marker in the output, a phrase the supervisor looks for — routing breaks whenever the model phrases it differently, and it breaks silently: the work is simply never handed off, and the supervisor continues as though it had been. Because the failure produces plausible prose rather than an error, it surfaces as a task that quietly did half of itself.","a6":false},{"id":"AHC-0047","t":"The handoff payload is complete and bounded","lv":"MUST","ly":["L4","L5"],"c":"functional-suitability","r":"What crosses a delegation boundary is constructed deliberately — the task, the constraints that still apply, the results the recipient needs, and the identity from AHC-0034 — rather than being either the whole accumulated transcript or a one-line summary. The payload has a declared shape and a size bound.","f":"Passing the entire transcript means every delegation multiplies context cost and carries the supervisor's reasoning into an agent that should be working from facts, and by the third hop the payload is mostly the history of how it got there. Passing too little is the opposite and more common: the recipient does its job competently against a constraint it was never told about, and the supervisor accepts the answer because it looks right.","a6":false},{"id":"AHC-0048","t":"Delegation depth and fan-out are bounded by the harness","lv":"MUST","ly":["L4"],"c":"cost","r":"The harness limits how deep a chain of delegations may go and how many sub-agents any one agent may start, counting across the whole tree rather than per agent. Reaching either limit is a terminal outcome, distinct from exhausting a token or step budget.","f":"Without a depth bound, a supervisor that delegates to a specialist which delegates onward can recurse until something else stops it, and with a fan-out of even three the tree grows faster than any per-agent budget notices. The system spends its entire ceiling in a burst of concurrent sub-agents, none of which individually did anything unreasonable.","a6":false},{"id":"AHC-0049","t":"A sub-agent's failure is contained by its caller","lv":"MUST","ly":["L10","L4"],"c":"reliability","r":"Every delegation returns a discriminated outcome under AHC-0017, and the caller has a declared path for each — including the sub-agent stopping on its own budget, getting stuck, or being unreachable. A failure below does not propagate as an unhandled condition through the tree.","f":"Where a sub-agent's failure unwinds the supervisor, one specialist hitting a step ceiling destroys a task that was otherwise complete and had already taken irreversible actions elsewhere in the tree. The opposite is equally common and worse: the supervisor treats a failure result as an answer, and reports success built on a branch that produced nothing.","a6":false},{"id":"AHC-0050","t":"Each agent is attributable within one trace tree","lv":"MUST","ly":["L11","L13"],"c":"maintainability","r":"Every span, cost record and policy decision carries the identity of the agent that produced it and its position in the delegation tree, while sharing the single unit-of-work identifier from AHC-0026. Spend and step counts are readable both per agent and for the whole tree.","f":"Without per-agent attribution inside a shared trace, a multi-agent run is one undifferentiated pile of calls, and the question every such system eventually asks — which agent is burning the budget, which one loops, which one produced the wrong claim — has no answer. Teams respond by giving each agent its own trace, which makes per-agent questions answerable and destroys the ability to see the run as one task.","a6":false},{"id":"AHC-0051","t":"Shared state between agents has exactly one owner","lv":"MUST","ly":["L5"],"c":"reliability","r":"Where agents read and write common state — a scratchpad, a plan, a partial result set — exactly one component owns writes to each part of it, and the others read or propose. Concurrent writes to the same key are prevented structurally rather than avoided by convention.","f":"Two agents writing a shared plan concurrently produce a last-write-wins result in which one agent's work silently disappears, and because both reported success the supervisor believes both landed. The version that survives is decided by scheduling, so the same run produces different outcomes on different days with no change to anything anyone can see.","a6":false},{"id":"AHC-0052","t":"Cycles between agents are detected by the harness","lv":"MUST","ly":["L4"],"c":"cost","r":"The harness tracks the delegation path within a unit of work and terminates when an agent is re-entered with materially the same task it has already handled. Detection uses the recorded path, not a limit on total steps.","f":"Two agents that each believe the other is better suited will hand work back and forth indefinitely, each acting reasonably in isolation. A step ceiling eventually stops it, having spent the whole budget on transport — and the record shows an ordinary budget exhaustion rather than a ping-pong, so the topology bug survives to do it again.","a6":false},{"id":"AHC-0053","t":"A trigger produces exactly one run","lv":"MUST","ly":["L15","L10"],"c":"reliability","r":"Every trigger carries an identifier derived from the occasion that caused it, and the harness records that identifier durably before work begins, refusing a second run for the same occasion. **Where the caller can receive one, the refusal carries what the first run answered** rather than only the fact that it happened. Overlap is handled explicitly: a run still in flight when the next trigger arrives either blocks it, queues it or cancels itself, by declared policy.","f":"Schedulers deliver at least once, retry on ambiguous outcomes, and fire twice across a deployment or a clock adjustment. An unattended agent that takes actions will take them twice — two remediations, two messages, two refunds — and because nobody is watching in real time, the duplicate is discovered from its effects. A refusal that says only *already handled* has a quieter failure of its own: a caller whose reply was lost cannot tell a run that never happened from one that did, and the answer it needs already exists somewhere it has no handle for. Overlapping runs are the same failure with concurrency added: two instances acting on the same state, each unaware of the other.","a6":false},{"id":"AHC-0054","t":"An operator can stop a run from outside it","lv":"MUST","ly":["L14","L4"],"c":"safety","r":"A control exists, reachable without a deployment, that halts an in-flight run or suspends the whole class of runs, and the loop checks it between steps. The control operates at the harness level and does not depend on the run's own code choosing to observe it.","f":"When an unattended agent starts doing something wrong at two in the morning, the available options without this control are revoking a credential, scaling the service to zero, or waiting. Each of those is a broader outage than the problem, and each leaves the run's state torn at whatever step it reached. The first incident is where teams discover the stop control was never built.","a6":false},{"id":"AHC-0055","t":"Silence is an alertable condition","lv":"MUST","ly":["L11","L14"],"c":"reliability","r":"The absence of an expected run raises an alert on its own, driven by a schedule the monitoring side holds independently of the agent. A run that never started, a trigger that never fired and a process that died before emitting anything are each detectable without a signal from the thing that failed.","f":"Monitoring built on the records a run emits cannot see a run that emitted nothing, and an unattended agent that silently stops is indistinguishable from an unattended agent with nothing to do. The failure is discovered weeks later by whoever depended on the output, and the intervening period has no data in it because there was nothing to record.","a6":false},{"id":"AHC-0056","t":"Every action leaves a record written before the effect","lv":"MUST","ly":["L11","L5"],"c":"security","r":"For each action with an external effect, the harness durably records the intent — what, to which resource, under whose identity, on whose behalf, and why — before dispatching, and records the outcome after. The record does not depend on the run surviving to write it.","f":"Recording only after the fact means the actions with no record are exactly the ones that crashed midway, which are the ones an investigation needs most. An unattended agent that changed production and then died has left effects nobody can attribute, and the reconstruction is done by reading the changed systems backwards — which cannot recover intent, only outcome.","a6":false},{"id":"AHC-0057","t":"Irreversible actions require an approval the run cannot grant","lv":"MUST","ly":["L14"],"c":"safety","r":"Actions in the irreversible class from AHC-0039 are held pending an approval issued by a principal outside the run, naming the specific action and resource, unless the specification states the conditions under which the agent holds that authority itself — conditions over declared state, checked by the system on which the effect lands, never a judgement the model makes; a check made only on the harness side of the call does not meet this. An action taken under a person's approval carries the identity of that approval to the executing system, which loads it and confirms it names this action, these arguments and this resource before acting. The run has no tool, argument or instruction path by which it can approve itself or widen those conditions, and a pending action that is never approved expires rather than proceeding. The approval also records the state its assessment judged, and that state is re-established immediately before the action executes; where it has changed the action does not proceed and the decision is sought again against what is now true.","f":"Where approval is a step the agent performs — a self-check, a confidence threshold, a reflection prompt — it is subject to the same reasoning that proposed the action, and to any instruction that reached the model through retrieved content or tool output. An approval the run can grant is not a control; it is a delay that produces an audit trail suggesting there was one.\n\nThe second failure needs no compromised model and survives every other control on the path. An approval is the one place in a system where a human interval separates reading a row from acting on it, and the expiry window is satisfied by a decision made a minute ago. Where the effect's magnitude is a field on the resource rather than an argument on the call — a refund for an order's total, a transfer of an account's balance — the approver and the executing call read it separately, minutes or hours apart, and an argument-by-argument check between them compares values that both agree on while the value that matters moved. A person approves one amount and another leaves.","a6":true},{"id":"AHC-0058","t":"Each action class declares its compensating path","lv":"SHOULD","ly":["L10","L14"],"c":"safety","r":"For every action the system can take, the harness holds either a declared way to undo it, a declared way to counteract it, or an explicit statement that neither exists. Where a compensating path exists, it is invocable on its own, from the record in AHC-0056, without re-running the trajectory that produced the action.","f":"When an unattended run does the wrong thing across two hundred resources, recovery without declared compensation is a person reading logs and undoing changes by hand under time pressure — which is slow, error-prone, and frequently makes a second incident. The declaration matters as much as the mechanism: knowing in advance that an action cannot be undone changes whether it should have been automated at all.","a6":false},{"id":"AHC-0059","t":"Blast radius is bounded by configuration, not by intent","lv":"MUST","ly":["L15","L16"],"c":"safety","r":"The set of resources a run may affect and the number of actions it may take against them are declared as configuration and enforced at dispatch. The bound holds regardless of what the run concludes it should do, and reaching it stops the run rather than being reported alongside the work it already completed.","f":"An agent whose scope is described only in its instructions will act on whatever it can reach when its reasoning goes wrong — and reasoning going wrong at scale is the characteristic failure of unattended operation. A remediation agent that concludes every instance is unhealthy will remediate every instance, competently and quickly, because nothing in the system disagreed with it.","a6":false},{"id":"AHC-0060","t":"Retrieval is a substitutable step with its own record","lv":"MUST","ly":["L1","L12"],"c":"maintainability","r":"Retrieval sits behind an interface the harness can replace with a fixed set of passages, and every retrieval emits a record of the query it issued, the candidates it returned and their ranking scores. The generation step can be exercised against supplied passages without the retriever running at all.","f":"Fused into one call, a wrong answer has two possible causes that cannot be separated: the retriever found nothing useful, or the generator ignored what it found. Teams debug the prompt because the prompt is visible, and spend weeks on generation quality when the retriever was returning the wrong documents the entire time.","a6":false},{"id":"AHC-0061","t":"Every passage carries a resolvable source reference","lv":"MUST","ly":["L1","L6"],"c":"functional-suitability","r":"Each retrieved passage enters context with an identifier that resolves to a specific location in a specific version of a specific document, and that identifier survives into the response contract so a citation in the output can be mapped back to the passage it came from without matching on text.","f":"Where citations are prose the model composed, they are generated the same way the rest of the answer is — and a plausible-looking reference to a document that does not contain the claim is indistinguishable from a real one. Resolving them by string matching against the corpus fails on paraphrase, which is exactly what the model produces.","a6":false},{"id":"AHC-0062","t":"Entitlement filtering happens before ranking, not after","lv":"MUST","ly":["L16","L1"],"c":"security","r":"The requester's identity from AHC-0034 constrains the candidate set at the point of search, so passages the requester may not read are never retrieved, never ranked and never reach assembly. Filtering applied to results after retrieval is not sufficient.","f":"Post-filtering leaks in two ways. Result counts and relevance scores reveal that matching documents exist, which is disclosure even when the text is withheld. More seriously, any path that skips the filter — a summarisation step, a caching layer, a rewritten query, a debug view — sees the unfiltered set, and each of those is added later by someone who did not know the filter was the control.","a6":false},{"id":"AHC-0063","t":"Abstention is a harness outcome, not a phrasing choice","lv":"MUST","ly":["L6","L1"],"c":"functional-suitability","r":"When retrieval returns nothing above the relevance the system requires, the harness returns the abstained outcome from AHC-0017 without calling the generator at all. Where the generator does run and declines to answer, that decision maps onto the same outcome rather than being returned as ordinary prose.","f":"Where abstention is left to the model, it is a request that competes with the pull to be helpful, and the model answers from parametric knowledge instead — producing a confident, unsourced answer that looks exactly like a grounded one. Downstream, an abstention returned as prose is stored, indexed and rendered as though it were content.","a6":false},{"id":"AHC-0064","t":"The corpus version is part of the resolved configuration","lv":"MUST","ly":["L15","L9"],"c":"maintainability","r":"The index a run searched is identified in the same resolved record as the model pin and the prompt version, and index rebuilds produce a new identified version rather than mutating the one in service. A past run states which corpus version answered it.","f":"An index rebuilt in place changes the behaviour of a system whose code, prompts and model pins are all unchanged. Every offline result gathered before the rebuild describes a system that no longer exists, and the regression this causes is uniquely hard to attribute because every artifact under version control is identical on both sides of it.","a6":false},{"id":"AHC-0065","t":"Ingestion is a controlled path with recorded provenance","lv":"MUST","ly":["L16","L5"],"c":"security","r":"Content enters the corpus through a defined path that records where each document came from, who or what submitted it, and when. Which sources may contribute is declared configuration, and a document's origin remains attached to every passage derived from it.","f":"A corpus that accepts documents from wherever is a standing injection surface: text placed in an ingested source is retrieved later and read by the model as authoritative reference material. Without provenance, a poisoned or simply wrong document cannot be traced to its source or removed with its siblings, so remediation becomes a rebuild of the whole index.","a6":false},{"id":"AHC-0066","t":"Session state has a declared boundary and lifetime","lv":"MUST","ly":["L5"],"c":"reliability","r":"What constitutes one conversation is defined by the harness — what starts it, what ends it, how long it survives inactivity — and the state is addressed by an identifier the harness issues rather than inferred from a connection, a cookie or the presence of prior messages. Expiry is a declared behaviour, not the eviction policy of whatever store is underneath.","f":"Where the boundary is implicit, sessions end when infrastructure decides they do: a load balancer moves the connection, a process restarts, a cache evicts under pressure. The user experiences an assistant that abruptly forgets mid-conversation, and the cause is a configuration two layers away that nobody associated with conversation quality.","a6":false},{"id":"AHC-0067","t":"History is compacted by a declared, recorded strategy","lv":"MUST","ly":["L5","L1"],"c":"functional-suitability","r":"As a conversation grows past the context budget, the harness reduces it by a named strategy — drop oldest, summarise a window, retain a pinned set of facts — and each turn's record states which strategy ran and what it removed. The reduction is performed by the harness, not left to the model to manage inside its own reasoning.","f":"Uncontrolled, a long conversation either overflows or is truncated from the front, which discards the constraint the user set in their opening message — the budget, the audience, the format — while retaining recent small talk. The assistant then contradicts an instruction it was given and appears to have changed its mind, and no record shows that the instruction is simply no longer present.","a6":false},{"id":"AHC-0068","t":"Isolation between sessions and tenants is structural","lv":"MUST","ly":["L5","L16"],"c":"security","r":"Every read and write of conversation state, memory and cached responses is scoped by session and tenant in the key itself, so that a query omitting the scope cannot return another party's data. The scope is applied by the storage layer, not by a filter each call site is expected to include.","f":"Where scoping is a predicate callers add, one path that forgets it returns another customer's conversation, and that path is usually a later addition — an admin view, an analytics job, a cache introduced for latency. The semantic cache is the most dangerous instance: two users asking the same question in different words are a match by design, so a cache keyed on meaning alone serves one customer's answer to another.","a6":false},{"id":"AHC-0069","t":"Memory writes go through a gate, not straight from the model","lv":"MUST","ly":["L5"],"c":"functional-suitability","r":"What is promoted from a conversation into durable memory passes through a component that decides what is eligible, records where each remembered item came from, and can remove it. The model may propose what to remember; it does not write directly to the store.","f":"Where the model writes freely, anything said in a conversation becomes a durable fact about the user — including things the user was quoting, hypothesising or being told by an injected instruction in retrieved content. A wrong memory is worse than no memory: it is retrieved into every future conversation and reinforces itself, and without provenance nobody can find where it came from to remove it.","a6":false},{"id":"AHC-0070","t":"Escalation carries the context with it","lv":"SHOULD","ly":["L14"],"c":"interaction-capability","r":"Handing a conversation to a person transfers the transcript, what the system attempted, and why it escalated, into the surface that person already works in. The path is exercised under load rather than only when the system decides to use it, and it works when the model is unavailable.","f":"An escalation that hands over only a ticket makes the user repeat everything, which is the moment an assistant becomes worse than no assistant. The load case is worse still: the trigger for escalation is frequently the same outage that took the model down, so the path least exercised is the one needed exactly when everything else has failed.","a6":false},{"id":"AHC-0071","t":"Each node has a typed contract on both edges","lv":"MUST","ly":["L6","L4"],"c":"maintainability","r":"Every step in the graph declares what it accepts and what it produces, and the harness enforces both at the seam rather than at the step's convenience. A step can be exercised in isolation from its declared input type without running the steps before it.","f":"Where steps pass loosely-shaped values, a change to what one produces breaks a consumer two steps away, and the break surfaces as a wrong answer rather than an error — the downstream step reads a field that is now absent, treats it as empty, and continues. In a pipeline, the seams are the new failure surface, and untyped seams make every change a change to everything downstream.","a6":false},{"id":"AHC-0072","t":"The topology is data, inspectable without executing it","lv":"SHOULD","ly":["L4","L15"],"c":"maintainability","r":"The graph's nodes and edges can be enumerated as a structure, so the set of reachable paths is knowable without running anything. Where a branch is chosen by a model, the set of destinations it may choose among is declared rather than open-ended.","f":"A topology that exists only as control flow scattered through code cannot be reviewed, drawn, or checked for branches nobody exercises. A model-chosen branch with an open destination set is worse: the reachable states are unbounded, so no amount of exercising establishes that the dangerous path is unreachable, because it was never enumerable.","a6":false},{"id":"AHC-0073","t":"Step results are persisted so the graph can resume","lv":"MUST","ly":["L5","L10"],"c":"reliability","r":"Each completed step's output is written durably against the run's identifier before the next step begins, so a run interrupted partway can continue from its last completed step rather than from the start. The record distinguishes a step that completed from one that was dispatched and never confirmed.","f":"Without persistence, an interruption at step nine of ten discards nine steps of paid model calls, and the retry pays for all of them again. Where steps had external effects, restarting from the beginning repeats those effects — the enrichment pipeline that writes as it goes will write twice, and the second pass will be indistinguishable from the first in the destination.","a6":false},{"id":"AHC-0074","t":"Every step declares whether repeating it is safe","lv":"MUST","ly":["L10","L4"],"c":"reliability","r":"Each step states whether it can be re-executed with the same input without additional effect. Steps that cannot are given an idempotency key derived from the run and the step, carried to the downstream system, so a repeat is recognised there rather than being prevented only by the harness remembering not to retry. The step's identity is one a resumed run reproduces: a run restarted from its checkpoint after its process died derives the same key for the step it was taking, so the effect that landed before the crash is recognised rather than applied again.","f":"Retry logic added generically at the harness level treats all steps alike, and the first step with an external effect turns a transient timeout into a duplicate. Timeouts are the specific trap: the call succeeded and the response was lost, so the harness believes it failed and the downstream system has already applied it. Without a key at the destination, nothing can tell the two apart.","a6":true},{"id":"AHC-0075","t":"The end-to-end budget is allocated, not summed after the fact","lv":"SHOULD","ly":["L13","L4"],"c":"performance-efficiency","r":"Latency and spend ceilings are set for the run as a whole and divided among steps before execution, with each step receiving a remaining allowance rather than its own independent limit. A step that overruns reduces what is left for the rest, and the run's ceiling holds regardless of how the overrun was distributed.","f":"Per-step limits that were each set reasonably sum to a total nobody chose: ten steps at thirty seconds is five minutes, which no one would have approved as a stated figure. The same applies to spend, and to retries under AHC-0024, which multiply within each step's own allowance while the run-level total is not being watched at all.","a6":false},{"id":"AHC-0076","t":"The artifact is checked by running its own toolchain","lv":"MUST","ly":["L6","L12"],"c":"functional-suitability","r":"Before generated code, query, configuration or markup is returned, the harness passes it through the parser, compiler, schema validator or linter that the target platform itself uses, and the result of that pass is part of the returned outcome. The toolchain is the real one, at the version the destination runs.","f":"Judging a generated artifact by reading it, or by asking a model whether it looks right, misses the entire class of failure that a compiler catches for free. Where the check runs a different version from the destination, it passes artifacts the destination rejects — and the failure appears at deployment, attributed to the pipeline rather than to the generator.","a6":false},{"id":"AHC-0077","t":"Generated artifacts execute only in a bounded sandbox","lv":"MUST","ly":["L3","L16"],"c":"safety","r":"Where the harness runs what the model produced, it runs inside an environment with declared limits on filesystem reach, network egress, CPU, memory and wall-clock, holding no credentials beyond what that execution needs. The limits are enforced by the environment, not by the artifact agreeing to stay inside them.","f":"Executing generated code in the harness's own process gives it the harness's credentials, network position and filesystem — so a generated query with an unintended join, an infinite loop, or a snippet influenced by injected content runs with full production authority. Egress is the most commonly forgotten limit: a sandbox that bounds CPU and memory but permits outbound network is an exfiltration path.","a6":false},{"id":"AHC-0078","t":"The edit scope is declared and enforced outside the model","lv":"MUST","ly":["L3","L6"],"c":"safety","r":"Where output modifies existing material, the set of files, regions or objects it may change is declared before generation and enforced when the change is applied. A change touching anything outside that set is rejected rather than applied and reported.","f":"A model asked to fix one function will reformat the file, reorder imports, adjust an unrelated constant it judged wrong, or helpfully update a second call site. Each individual change may be defensible; the aggregate is a diff nobody asked for, arriving where a reviewer expected three lines. At scale this is how a generated change set becomes unreviewable and gets approved anyway.","a6":false},{"id":"AHC-0079","t":"Generated artifacts carry their provenance forward","lv":"SHOULD","ly":["L11","L15"],"c":"maintainability","r":"An artifact that will be committed, deployed or shipped is associated with the resolved configuration that produced it, the request that asked for it, and the checks it passed — durably, and reachable from the artifact itself rather than only from a trace that will be sampled away.","f":"Generated code merged without provenance is indistinguishable from hand-written code six months later. When a systematic defect is found — a pattern the model reproduced across dozens of files, a library version it consistently got wrong — there is no way to enumerate what to re-examine, and the remediation becomes a manual audit of the whole repository.","a6":false},{"id":"AHC-0080","t":"Rejection is a supported path, not a discard","lv":"SHOULD","ly":["L14","L12"],"c":"maintainability","r":"When a person declines a generated artifact, the harness captures the artifact, the request that produced it and the stated reason, in a form that can be promoted into a curated set under AHC-0029. Rejection is an event the system records, not the absence of an acceptance.","f":"Where rejection is just closing a window, the most valuable signal the system produces is discarded at the moment it is generated — a human has just labelled an output as wrong, for free, with a reason. Without capture, the same defect is regenerated indefinitely, and the team's belief about quality is formed from the outputs that happened to be accepted.","a6":false},{"id":"AHC-0081","t":"The judge is a component with its own version and record","lv":"MUST","ly":["L12","L15"],"c":"maintainability","r":"A model used to score, classify or route is constructed through the same choke point as any other model call, with its own pin, its own prompt version and its own resolved configuration, and its calls appear in the record distinguishable from the calls it is judging.","f":"Embedded as a helper function, the judge's model and rubric move without anyone treating those as releases, and its own cost and latency are invisible — folded into the step that invoked it. A system whose judge quietly changed will show a shift in scores that everyone attributes to the thing being judged, and the investigation starts in the wrong place and stays there.","a6":false},{"id":"AHC-0082","t":"A verdict is typed, and includes an explicit uncertain state","lv":"MUST","ly":["L6","L12"],"c":"maintainability","r":"A judge returns a value from a declared set, parsed and validated at the boundary, and that set contains a state meaning the judge could not decide. Output that does not parse into the declared set is a judge failure with its own handling, never coerced into the nearest valid verdict.","f":"Where a verdict is free text matched against expected words, anything unexpected falls through to a default — and the default is usually \"pass\", so a judge that has stopped working reports everything as fine. Without an uncertain state, a genuinely ambiguous case is forced into a confident verdict, and the resulting number carries no trace of the coin-flip that produced it.","a6":false},{"id":"AHC-0083","t":"The judge's inputs are fenced like any other untrusted content","lv":"MUST","ly":["L1","L12"],"c":"security","r":"The material a judge examines — a model's output, a user's input, a retrieved passage — enters the judge's context through the assembly path of AHC-0011, carrying untrusted provenance. The rubric is standing instruction under AHC-0013 and is structurally separate from the material being assessed.","f":"A judge is a model reading text and is subject to everything any other model is. Text that says it has already been approved, or that addresses the grader directly, will influence the verdict — and because the judge is frequently the guardrail, an output that talks its way past its own grader defeats the control that existed to catch it. The failure is silent by construction: the verdict says pass.","a6":false},{"id":"AHC-0084","t":"A human-labelled set exists for the judge itself","lv"
