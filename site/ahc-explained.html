<div class="card bad"><div class="big">🗄️🚫</div><h3>Before</h3><p>Three places held customer data and only one could delete: logins, at logout. Conversations and the record of actions could never be removed.</p></div>
<div class="card good"><div class="big">🧹</div><h3>After</h3><p>One call reaches all three in the right order and says how many went from each.</p></div>
<div class="card good"><div class="big">⬜</div><h3>No name, nothing removed</h3><p>A request with an empty customer id removes nothing, instead of matching every row with no owner.</p></div>
</div>
`};

/* ---------- rendering ---------- */
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify = s => esc(s).replace(/AHC-\d{4}/g, m => `<a href="#${m}">${m}</a>`);
let query = "", onlyPics = false;

function renderList(){
  document.title = "AHC Specs Explained";
  app.innerHTML = `
  <h1>AI Harness Catalog — the specs</h1>
  <p class="lede">${SPECS.length} rules for what the machinery around an AI agent must do, grouped by the quality each one protects, in the Concern View’s order. Within a group: MUST, then SHOULD, then MAY. Click any line to open it. Lines marked <span class="tag pic">ILLUSTRATED</span> have a picture-first explanation written for non-technical readers. Lines marked <span class="tag na">NOT REQUIRED FOR US</span> are for other kinds of agent; our reference agent is a tool-using agent (A6), which owes 72 of these.</p>
  <div class="tools"><input id="q" type="search" placeholder="Search by number or words…" value="${esc(query)}">
  <label class="toggle"><input type="checkbox" id="op" ${onlyPics?"checked":""}> Illustrated only</label><span class="count" id="cnt"></span></div>
  <ul class="specs" id="ul"></ul>`;
  const ul = document.getElementById("ul"), cnt = document.getElementById("cnt");
  const draw = () => {
    const q = query.toLowerCase();
    const rows = SPECS.filter(s => (!onlyPics || PICS[s.id]) && (!q || (s.id + " " + s.t).toLowerCase().includes(q)));
    let html = "", n = 0;
    for (const c of CONCERNS) {
      const group = rows.filter(s => s.c === c.id);
      if (!group.length) continue;
      html += `<li class="grp"><span class="gn">${++n} · ${esc(c.name)}</span><span class="gd">${esc(c.plain)}</span><span class="gc">${group.length}</span></li>`;
      html += group.map(s => `<li><a href="#${s.id}"><span class="id">${s.id}</span><span class="tt">${esc(s.t)}</span>${PICS[s.id]?'<span class="tag pic">ILLUSTRATED</span>':""}${s.a6?"":'<span class="tag na" title="Not required for a tool-using agent (A6), the shape of our reference agent">NOT REQUIRED FOR US</span>'}<span class="tag ${s.lv}">${s.lv}</span></a></li>`).join("");
    }
    ul.innerHTML = html;
    cnt.textContent = rows.length === SPECS.length ? "" : `${rows.length} shown`;
  };
  const qi = document.getElementById("q");
  qi.oninput = e => { query = e.target.value; draw(); };
  document.getElementById("op").onchange = e => { onlyPics = e.target.checked; draw(); };
  draw();
}

function renderSpec(id){
  const i = SPECS.findIndex(s => s.id === id);
  if (i < 0) return renderList();
  const s = SPECS[i], p = PICS[id], prev = SPECS[i-1], next = SPECS[i+1];
  document.title = `${s.id} · AHC Specs Explained`;
  const layers = s.ly.map(l => `${l} ${LAYERS[l]||""}`).join(" · ");
  const exact = `<p>${linkify(s.r).replace(/\n\n/g,"</p><p>")}</p>`;
  const fail = s.f ? `<p>${linkify(s.f).replace(/\n\n/g,"</p><p>")}</p>` : "";
  app.innerHTML = `
  <a class="back" href="#">← All specs</a>
  <div class="meta"><span class="mono">${s.id}</span><span class="tag ${s.lv}">${s.lv}</span>${s.a6?"":'<span class="tag na">NOT REQUIRED FOR US</span>'}<span>${esc(layers)}</span><span>· ${esc(s.c.replace(/-/g," "))}</span></div>
  <h1>${esc(s.t)}</h1>
  ${p ? `<div class="oneline">${p.oneline}</div>${p.body}
    <details><summary>The exact wording of the spec</summary>${exact}${fail?"<p><b>Why it exists</b></p>"+fail:""}</details>`
      : `<div class="note">No illustrated explanation yet — here is the spec as written.</div>
    <h2>What it asks for</h2><div class="prose">${exact}</div>
    ${fail?`<h2>What goes wrong without it</h2><div class="prose">${fail}</div>`:""}`}
  <div class="nav">${prev?`<a href="#${prev.id}">← ${prev.id}</a>`:"<span></span>"}${next?`<a href="#${next.id}">${next.id} →</a>`:"<span></span>"}</div>`;
  app.querySelectorAll(".quiz button").forEach(b => b.onclick = () => b.classList.toggle("shown"));
  window.scrollTo(0,0);
}

function route(){ const h = decodeURIComponent(location.hash.slice(1)); h ? renderSpec(h) : renderList(); }
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
