# secrets — the seam to whatever holds credentials.
port: secrets
status: active
since: "0.4.0"

tier: core
direction: consumed
layers: [L16]

summary: >-
  Resolution of a credential reference into something usable at the moment of
  egress, without the credential ever becoming an ordinary string that could be
  assembled into context, logged, or attached to a span.

serves: [AHC-0035]

kernel_owns: >-
  Where a credential may be used, the refusal to render one into assembled
  context or a recorded attribute, and the requirement that assembly operates on
  references rather than values.

supplied_outside: >-
  Storage, rotation and access control for credentials, and resolution of a
  reference into a usable value at the point of use.

operations:
  - name: resolve
    intent: Turn a credential reference into a handle usable only at a point of egress.
  - name: rotate
    intent: Replace the value behind a reference without a redeploy or a restart.
    optional: true

invariants:
  - must: A resolved credential is a handle that cannot be interpolated into a string or a template.
    because: >-
      The moment a credential is an ordinary string, one format call away is a
      prompt, a log line or a span attribute — and it will happen, because the
      code that does it is unremarkable.
    capability: AHC-0035
    checkable: static
  - must: Context assembly operates on references and never on resolved values.
    because: >-
      A value that reaches the assembler can reach the model, and from there the
      provider's logs, which are outside the adopter's retention policy entirely.
    capability: AHC-0035
    checkable: static
  - must: Rotation does not require a redeploy.
    because: >-
      A credential that can only change with a release is a credential nobody
      rotates during an incident, which is the only time it matters.
    capability: AHC-0035
    checkable: declared

substitution_test: >-
  Replace the implementation with environment variables. Every point of use must
  be unchanged, and the handle must remain un-stringifiable; only the source and
  the rotation story may differ.

see_also: [identity, config]
