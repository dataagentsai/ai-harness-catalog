# AHC-0079 — Generated artifacts carry their provenance forward
id: AHC-0079
status: active
since: "0.2.0"

level: SHOULD
layers: [L11, L15]
positions: [P3, P6]

concern: maintainability
facet: analysability

archetypes: [A8]
core: false

title: |-
  Generated artifacts carry their provenance forward

requirement: |-
  An artifact that will be committed, deployed or shipped is associated with the resolved configuration that produced it, the request that asked for it, and the checks it passed — durably, and reachable from the artifact itself rather than only from a trace that will be sampled away.

failure_mode: |-
  Generated code merged without provenance is indistinguishable from hand-written code six months later. When a systematic defect is found — a pattern the model reproduced across dozens of files, a library version it consistently got wrong — there is no way to enumerate what to re-examine, and the remediation becomes a manual audit of the whole repository.

discharges: [AAC-0074, AAC-0107, AAC-0080]

design_decisions:
  - question: Where does provenance live — in the artifact, or beside it?
    tension: >-
      In the artifact it always travels with it and adds noise to the file that
      reviewers and formatters will fight over. Beside it keeps files clean and
      breaks the moment the artifact is copied, moved or vendored.
  - question: How much detail is recorded?
    tension: >-
      Recording the full request makes the artifact explicable and may embed
      customer context or internal detail into something that ships publicly.
    resolution: >-
      A reference to the run under AHC-0026, not the content of it. The record
      resolves; the artifact stays clean.
  - question: Does provenance survive review edits?
    tension: >-
      An artifact edited by a person after generation is partly generated and
      partly not, and marking the whole thing as generated is then misleading in
      the direction that matters least.

realization_policy: own

see_also: [AHC-0003, AHC-0026, AHC-0076]
