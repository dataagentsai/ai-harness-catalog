# AHC-0040 — Tool authority is enforced where the tool executes
id: AHC-0040
status: active
since: "0.2.0"

level: MUST
layers: [L3, L16]
positions: [P5, P6]

concern: security
facet: resistance

archetypes: [A6, A7, A9]
core: false

title: |-
  Tool authority is enforced where the tool executes

requirement: |-
  The permissions a tool operates under are held by the executing side and scoped to the least it needs, so that removing a tool from the model's view does not change what the credentials behind it could do. The set of tools shown to the model is a usability decision; the set of actions possible is an authorisation decision, and they are enforced in different places.

failure_mode: |-
  Where authority lives only in which tools the model was offered, the boundary is a prompt-time list. Anything that reaches the dispatcher by another path — a retried call, a replayed trajectory, an injected instruction that names a tool still registered — executes with whatever the service account holds. Teams discover the gap when a read-only agent turns out to hold write credentials because both tools shared one connection.

discharges: [AAC-0057, AAC-0032, AAC-0072]

design_decisions:
  - question: One credential per tool, or one per agent?
    tension: >-
      Per tool is genuinely least-privilege and multiplies the credentials to
      issue, rotate and store. Per agent is manageable and grants the union of
      everything any of its tools needs, permanently.
    resolution: >-
      Per tool where the tool writes. Read-only tools can reasonably share, since
      the blast radius of a read is bounded by AHC-0034.
  - question: Does the executing side know which agent called it?
    tension: >-
      Passing the agent's identity enables per-agent policy downstream and adds
      a header the downstream must be built to honour, which usually means it
      does not.
  - question: Is the tool inventory itself protected?
    tension: >-
      A registry that any code path can add to means a new tool is a new
      capability with no review. Locking it down means adding a tool becomes a
      change-management exercise, which is exactly when people start using a
      generic escape-hatch tool instead.

realization_policy: own

see_also: [AHC-0034, AHC-0035, AHC-0039]
