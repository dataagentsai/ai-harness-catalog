# AHC-0005 — A declared degradation path for provider failure
# Normative. Edit here; anything rendered is generated from this file.
id: AHC-0005
status: active
since: "0.1.0"

level: MUST
layers: [L10]
positions: [P3, P2]

archetypes: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
core: true

title: |-
  A declared degradation path for provider failure

requirement: |-
  For each way the provider can fail — timeout, rate limit, content refusal, malformed response, total outage — the harness has a declared outcome: retry with a bounded policy, fall back to another route, return a defined degraded result, or fail with a typed error. The set is exhaustive, so an unclassified failure has a declared default rather than propagating whatever the client library raised.

failure_mode: |-
  Undeclared, these collapse into one generic exception path, and the system responds identically to a rate limit it should have waited out and a content refusal it should never retry. Retrying a refusal burns budget to receive the same answer; not retrying a throttle turns a survivable blip into an outage.

discharges: [AAC-0009, AAC-0015]

design_decisions:
  - question: Is a retry safe for this call?
    tension: >-
      Retrying a pure transform is free. Retrying a call that already triggered
      a tool with side effects duplicates the effect, and the harness usually
      cannot tell the two apart from inside the call.
    resolution: >-
      Idempotency is a property the caller declares, not one the harness infers.
      Default to not retrying anything that may have acted.
  - question: Fall back to a weaker model, or fail?
    tension: >-
      A fallback keeps the feature alive, on a model whose behaviour may not
      have been through the same evaluation — so quality silently changes at
      exactly the moment nobody is looking at quality.
    resolution: >-
      Permitted only where the fallback route carries the same contract, and the
      route taken is recorded so the change is attributable afterwards.
  - question: Who owns the timeout — the harness, the gateway, or the client?
    tension: >-
      Multiple layers each with their own timeout produce a shortest-wins race
      that nobody configured deliberately, and the observed timeout belongs to
      whichever layer happened to be tightest.
    resolution: >-
      One authoritative budget, passed down. Layers below it enforce, they do
      not invent.

realization_policy: own

see_also: [AHC-0001, AHC-0008]
