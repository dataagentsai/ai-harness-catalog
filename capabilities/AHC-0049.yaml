# AHC-0049 — A sub-agent's failure is contained by its caller
id: AHC-0049
status: active
since: "0.2.0"

level: MUST
layers: [L10, L4]
positions: [P4]

concern: reliability
facet: fault tolerance

archetypes: [A7]
core: false

title: |-
  A sub-agent's failure is contained by its caller

requirement: |-
  Every delegation returns a discriminated outcome under AHC-0017, and the caller has a declared path for each — including the sub-agent stopping on its own budget, getting stuck, or being unreachable. A failure below does not propagate as an unhandled condition through the tree.

failure_mode: |-
  Where a sub-agent's failure unwinds the supervisor, one specialist hitting a step ceiling destroys a task that was otherwise complete and had already taken irreversible actions elsewhere in the tree. The opposite is equally common and worse: the supervisor treats a failure result as an answer, and reports success built on a branch that produced nothing.

discharges: [AAC-0065, AAC-0066, AAC-0046]

design_decisions:
  - question: Retry the sub-agent, reassign, or degrade?
    tension: >-
      Retrying doubles the spend on a branch already known to be expensive.
      Reassigning to a different agent may work and duplicates any side effects
      the first one already caused. Degrading is cheap and returns an answer
      missing a piece the caller may not notice is missing.
    resolution: >-
      Whichever is chosen, the parent's outcome must record that a branch failed.
      An answer assembled from a failed branch that looks whole is the worst
      available result.
  - question: Are sub-agent side effects rolled back on containment?
    tension: >-
      Rolling back is correct and requires every delegated action to have a
      compensating path under AHC-0058, which most do not. Leaving them applied
      is simple and leaves the system partially changed by a task that failed.
  - question: Does the supervisor see the sub-agent's trajectory or just its result?
    tension: >-
      The full trajectory helps it judge whether to trust a marginal result and
      costs the context that delegation existed to save.

realization_policy: own

see_also: [AHC-0017, AHC-0043, AHC-0058]
