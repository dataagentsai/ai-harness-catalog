# AHC-0067 — History is compacted by a declared, recorded strategy
id: AHC-0067
status: active
since: "0.2.0"

level: MUST
layers: [L5, L1]
positions: [P3]

archetypes: [A4]
core: false

title: |-
  History is compacted by a declared, recorded strategy

requirement: |-
  As a conversation grows past the context budget, the harness reduces it by a named strategy — drop oldest, summarise a window, retain a pinned set of facts — and each turn's record states which strategy ran and what it removed. The reduction is performed by the harness, not left to the model to manage inside its own reasoning.

failure_mode: |-
  Uncontrolled, a long conversation either overflows or is truncated from the front, which discards the constraint the user set in their opening message — the budget, the audience, the format — while retaining recent small talk. The assistant then contradicts an instruction it was given and appears to have changed its mind, and no record shows that the instruction is simply no longer present.

discharges: [AAC-0038, AAC-0039, AAC-0042]

design_decisions:
  - question: Are some turns pinned?
    tension: >-
      Pinning the opening constraints keeps them in force indefinitely and
      permanently reserves budget that later turns need. Pinning nothing is
      simple and guarantees the first instruction is the first thing lost.
    resolution: >-
      Extract durable constraints into a separate held set rather than pinning
      raw turns. What must survive is the constraint, not the message.
  - question: Summarise with the same model that serves the conversation?
    tension: >-
      Reusing it is simple and a summarisation error becomes an unnoticed
      permanent falsification of history, since the original is gone. A cheaper
      model is cheaper and worse at exactly this.
  - question: Can the user see that compaction occurred?
    tension: >-
      Surfacing it explains an apparent lapse of memory and exposes an
      implementation detail that reduces confidence in the product.

realization_policy: own

see_also: [AHC-0012, AHC-0066, AHC-0069]
