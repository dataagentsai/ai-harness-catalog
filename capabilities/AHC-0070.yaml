# AHC-0070 — Escalation carries the context with it
id: AHC-0070
status: active
since: "0.2.0"

level: SHOULD
layers: [L14]
positions: [P8, P3]

concern: interaction-capability
facet: user assistance

archetypes: [A4]
core: false

title: |-
  Escalation carries the context with it

requirement: |-
  Handing a conversation to a person transfers the transcript, what the system attempted, and why it escalated, into the surface that person already works in, where it appears without anyone having to go and look for it. A handoff recorded only in the system's own store, which no person's surface reads, has not been made. The path is exercised under load rather than only when the system decides to use it, and it works when the model is unavailable.

failure_mode: |-
  An escalation that hands over only a ticket makes the user repeat everything, which is the moment an assistant becomes worse than no assistant. The load case is worse still: the trigger for escalation is frequently the same outage that took the model down, so the path least exercised is the one needed exactly when everything else has failed.

  The variant no load test finds: the escalation is written, completely and correctly, to a table that no person's tool reads. Every check on the system's side passes — the record exists, the context is in it, the user was given a reference — and the queue's entries are, to anyone who could act on them, indistinguishable from lost.

discharges: [AAC-0043, AAC-0009, AAC-0037]

design_decisions:
  - question: Can the system escalate when the model is down?
    tension: >-
      Routing escalation through the model's own judgement means it cannot
      escalate when the model is unavailable, which is when it most needs to.
    resolution: >-
      A deterministic escalation path that does not require a model call. Model
      judgement selects among reasons; it does not gate the transfer.
  - question: Does the person see the model's reasoning?
    tension: >-
      Showing it explains what was already tried and anchors the person on the
      system's interpretation, which may be exactly the mistake that caused the
      escalation.
    resolution: >-
      The person sees what was attempted and why the system escalated, as facts:
      each action with its result, and the reason from the declared set. The
      model's interpretation may be shown, labelled as its stated reading and
      placed after the user's own words, never as a summary in place of them.
  - question: Can the conversation come back?
    tension: >-
      Returning it after a person resolves the blockage preserves continuity and
      requires the state boundary of AHC-0066 to survive an arbitrary human
      interval.
    resolution: >-
      Yes, when the person chooses to hand it back, and only then. While a
      person holds the conversation its session does not expire; on return it
      resumes under the same identifier (AHC-0066) with the person's resolution
      added to its record, so the system continues from what was decided rather
      than from where it stalled.

realization_policy: own

see_also: [AHC-0017, AHC-0057, AHC-0066]
