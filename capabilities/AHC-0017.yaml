# AHC-0017 — The caller receives a discriminated outcome, never a bare value
id: AHC-0017
status: active
since: "0.2.0"

level: MUST
layers: [L6, L10]
positions: [P3]

concern: functional-suitability
facet: functional correctness

archetypes: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
core: true

title: |-
  The caller receives a discriminated outcome, never a bare value

requirement: |-
  The harness returns a value that names which of its terminal states occurred, drawn from one list — succeeded, refused by policy, abstained for lack of grounds, degraded to a fallback, exhausted a budget, waiting on something that now holds the work, or failed — and the caller cannot read the payload without having handled the discriminator. A harness returns each state one of its own paths can reach, and has a branch-worthy value for every one it returns; it does not invent a state no path reaches. Abstained is reachable where the harness itself decides there are no grounds to answer — retrieval below the relevance it requires (AHC-0063), a deterministic route with nothing to answer from — and is not a label for a model's sentence saying it does not know. Waiting is reachable where the run left the answer to something that will produce it — a pending decision, a person holding a handoff, a continuation the caller can drive (AHC-0106) — and it carries that thing's reference; a waiting outcome with no reference is not one. Only failed is a failure: the kinds of AHC-0110 classify what went wrong inside it, and the other six states are outcomes that carry no failure kind.

failure_mode: |-
  Where every state returns a string, a policy refusal, an abstention and a real answer are indistinguishable to the consumer, and all three get rendered to the user or written to a database as though they were results. The system that stores "I don't have enough information to answer that" as a customer record is the standard symptom.

discharges: [AAC-0002, AAC-0009, AAC-0091]

design_decisions:
  - question: How many terminal states should there be?
    tension: >-
      Few states are easy to consume and force distinct situations into one
      branch, so callers cannot respond differently to a refusal and an outage.
      Many states are precise and push a large match statement onto every
      caller, most of whom will collapse it back.
    resolution: >-
      Start with the states a caller would genuinely act on differently. A state
      nobody branches on is a log line, not a return type.
  - question: Does a degraded result look like a success?
    tension: >-
      Marking it degraded is honest and means callers must decide what to do
      with a usable answer from an unintended route. Not marking it means
      quality changed and nothing recorded that it did.
    resolution: >-
      Mark it. The route taken is already in the record under AHC-0027; the
      return type should agree with the record.
  - question: Is abstention a success or a failure?
    tension: >-
      Treating a correct refusal to answer as a failure makes reliability
      metrics punish exactly the behaviour you wanted. Treating it as a success
      hides a corpus that cannot answer anything.
    resolution: >-
      Neither. It is its own state and is counted as itself, so a correct
      abstention costs no reliability and a system that abstains on everything
      shows up as a rising abstention rate rather than disappearing into the
      success count. It carries no failure kind under AHC-0110, because nothing
      went wrong that a caller could retry, escalate or fix.
  - question: Is waiting one state, or one per thing that can be waited on?
    tension: >-
      A pending approval and a handoff to a person are acted on differently by
      an operator, and AHC-0114's record names them apart (escalated, waiting).
      But a caller does the same thing with both: shows the reference and does
      not read the reply as the answer.
    resolution: >-
      One state, carrying what it waits on and that thing's reference. The
      record may name it more finely; the return type branches where callers
      do. Generation run 3 found the list without it while AHC-0106 and
      AHC-0114 both required it.

realization_policy: own

see_also: [AHC-0001, AHC-0005, AHC-0016, AHC-0063, AHC-0106, AHC-0110, AHC-0114]
