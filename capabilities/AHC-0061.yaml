# AHC-0061 — Every passage carries a resolvable source reference
id: AHC-0061
status: active
since: "0.2.0"

level: MUST
layers: [L1, L6]
positions: [P3]

archetypes: [A3]
core: false

title: |-
  Every passage carries a resolvable source reference

requirement: |-
  Each retrieved passage enters context with an identifier that resolves to a specific location in a specific version of a specific document, and that identifier survives into the response contract so a citation in the output can be mapped back to the passage it came from without matching on text.

failure_mode: |-
  Where citations are prose the model composed, they are generated the same way the rest of the answer is — and a plausible-looking reference to a document that does not contain the claim is indistinguishable from a real one. Resolving them by string matching against the corpus fails on paraphrase, which is exactly what the model produces.

discharges: [AAC-0030, AAC-0029, AAC-0035]

design_decisions:
  - question: Does the model choose the citation, or does the harness?
    tension: >-
      Model-chosen citations attach to individual sentences and can be
      fabricated. Harness-attached citations list what was retrieved and cannot
      say which passage supported which claim, which is the question a reader
      actually has.
    resolution: >-
      Model selects from an enumerated set of supplied identifiers; anything
      outside that set is rejected at the boundary rather than rendered.
  - question: What is a passage's identity when the document changes?
    tension: >-
      Identifying by document alone means the citation still resolves after the
      content it supported has been rewritten. Identifying by content version
      is honest and produces dead references as the corpus moves.
    resolution: >-
      Version-pinned, with an explicit stale state. A citation that silently
      resolves to different text is worse than one that says it is stale.

realization_policy: own

see_also: [AHC-0060, AHC-0063, AHC-0065]
