# AHC-0083 — The judge's inputs are fenced like any other untrusted content
id: AHC-0083
status: active
since: "0.2.0"

level: MUST
layers: [L1, L12]
positions: [P3]

archetypes: [A10]
core: false

title: |-
  The judge's inputs are fenced like any other untrusted content

requirement: |-
  The material a judge examines — a model's output, a user's input, a retrieved passage — enters the judge's context through the assembly path of AHC-0011, carrying untrusted provenance. The rubric is standing instruction under AHC-0013 and is structurally separate from the material being assessed.

failure_mode: |-
  A judge is a model reading text and is subject to everything any other model is. Text that says it has already been approved, or that addresses the grader directly, will influence the verdict — and because the judge is frequently the guardrail, an output that talks its way past its own grader defeats the control that existed to catch it. The failure is silent by construction: the verdict says pass.

discharges: [AAC-0085, AAC-0088, AAC-0004]

design_decisions:
  - question: Does the judge see the original prompt as well as the output?
    tension: >-
      Seeing the prompt is necessary to judge instruction adherence at all, and
      it doubles the untrusted surface — now the user's input can address the
      grader too.
    resolution: >-
      Include it, fenced separately from the output, so the two untrusted
      sources are at least distinguishable in the record.
  - question: Should the judge be a classifier rather than a generative model?
    tension: >-
      A fine-tuned classifier has a far smaller instruction surface and is
      correspondingly harder to talk around; it also cannot explain its verdict
      or adapt to a rubric change without retraining.
  - question: Is the judge's own output screened?
    tension: >-
      Screening it treats the grader as another untrusted producer, which is
      consistent and adds a control on a control. Not screening it means
      whatever the judge emits is trusted by construction.

realization_policy: own

see_also: [AHC-0011, AHC-0013, AHC-0084]
