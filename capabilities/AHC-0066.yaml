# AHC-0066 — Session state has a declared boundary and lifetime
id: AHC-0066
status: active
since: "0.2.0"

level: MUST
layers: [L5]
positions: [P6, P3]

concern: reliability
facet: faultlessness

archetypes: [A4]
core: false

title: |-
  Session state has a declared boundary and lifetime

requirement: |-
  What constitutes one conversation is defined by the harness — what starts it, what ends it, how long it survives inactivity — and the state is addressed by an identifier the harness issues rather than inferred from a connection, a cookie or the presence of prior messages. Expiry is a declared behaviour, not the eviction policy of whatever store is underneath. That identifier is the one handed to the caller, and the conversation's latest state is retrievable by it alone, however many runs the conversation has spanned; state filed only under an identifier minted per run or per turn does not meet this, because no caller holds that identifier when the next message arrives.

failure_mode: |-
  Where the boundary is implicit, sessions end when infrastructure decides they do: a load balancer moves the connection, a process restarts, a cache evicts under pressure. The user experiences an assistant that abruptly forgets mid-conversation, and the cause is a configuration two layers away that nobody associated with conversation quality.

  The quieter variant has a boundary and still cannot be continued. State is checkpointed faithfully, under the identifier of the run that wrote it, and a fresh run is minted for every turn, so nothing a caller can present finds the conversation again. Every test passes, because tests hand the state from one turn to the next in memory; the defect appears as the first request handler that cannot be written: three lines in, it needs the conversation behind what the caller sent, and has no way to find it.

discharges: [AAC-0038, AAC-0040, AAC-0037]

design_decisions:
  - question: Does the user own the session boundary, or the system?
    tension: >-
      User-controlled boundaries match intent and mean state accumulates
      indefinitely for anyone who never starts a new one. System-controlled
      expiry is bounded and cuts across a conversation someone was still having.
    resolution: >-
      Both, with the system holding the outer bound. The user may end a session
      whenever they like; the system ends it after a declared inactivity
      lifetime, and activity does not extend it without limit. What a person
      expects to carry across that boundary is the job of gated memory
      (AHC-0069), not of a session that never closes.
  - question: Where does the state live?
    tension: >-
      In-process is fast and ties the conversation to one instance, so any
      deployment ends every live session. External is durable, survives
      restarts, and adds a dependency on the request path of every turn.
    resolution: >-
      External wherever more than one instance runs. Sticky routing is a
      deployment constraint disguised as an architecture.
  - question: What is retained after the session ends?
    tension: >-
      Retaining the transcript enables review and long-term memory and turns an
      ephemeral exchange into a stored record with a retention obligation
      attached.
    resolution: >-
      Only what a declared purpose needs, each with its own retention. With no
      purpose declared, the transcript ends with the session; where review
      needs it, it is kept for the stated review window and is erasable per
      person (AHC-0115). What outlives the session as knowledge about the user
      is what the memory gate admitted (AHC-0069), and the record of actions
      taken (AHC-0056) is kept on its own terms regardless.

realization_policy: own

see_also: [AHC-0067, AHC-0068, AHC-0069]
