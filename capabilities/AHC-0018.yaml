# AHC-0018 — Policy decisions are recorded as events, not side effects
id: AHC-0018
status: active
since: "0.2.0"

level: MUST
layers: [L7, L11]
positions: [P2, P3]

concern: security
facet: accountability

archetypes: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
core: true

title: |-
  Policy decisions are recorded as events, not side effects

requirement: |-
  Every time a policy runs, it emits a record naming the policy, its version, the decision, and what the decision was based on — including when the decision was to allow. The record attaches to the same unit of work as the call it governed.

failure_mode: |-
  Where only blocks are recorded, the allow path is invisible, and there is no way to distinguish a policy that examined traffic and passed it from a policy that was disabled, misconfigured or silently erroring. Over-blocking is equally invisible in the other direction: nobody can count refusals of legitimate requests, so the tuning conversation has no data in it and defaults to loosening after the first complaint.

discharges: [AAC-0091, AAC-0011, AAC-0020]

design_decisions:
  - question: Record the matched content, or only that a match occurred?
    tension: >-
      Recording the matched span is what makes a false positive diagnosable, and
      it means the record now contains exactly the sensitive material the policy
      existed to catch.
    resolution: >-
      Record the policy, the classification and an offset. Recording the matched
      text reproduces the leak inside the audit trail.
  - question: Is an allow decision worth the volume?
    tension: >-
      Recording every allow is what proves the control was live during the
      window an auditor asks about; it also multiplies event volume by the
      number of policies on every request.
    resolution: >-
      Record allows at low cardinality — a counter per policy per interval —
      and full records for anything not allowed.
  - question: Does the record survive when the policy machinery is down?
    tension: >-
      A policy that fails and records nothing is indistinguishable from a policy
      that ran and allowed. The unavailable case is precisely the one that must
      leave a trace.

realization_policy: own

see_also: [AHC-0006, AHC-0008, AHC-0019]
