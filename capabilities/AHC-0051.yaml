# AHC-0051 — Shared state between agents has exactly one owner
id: AHC-0051
status: active
since: "0.2.0"

level: MUST
layers: [L5]
positions: [P6, P4]

concern: reliability
facet: faultlessness

archetypes: [A7]
core: false

title: |-
  Shared state between agents has exactly one owner

requirement: |-
  Where agents read and write common state — a scratchpad, a plan, a partial result set — exactly one component owns writes to each part of it, and the others read or propose. Concurrent writes to the same key are prevented structurally rather than avoided by convention.

failure_mode: |-
  Two agents writing a shared plan concurrently produce a last-write-wins result in which one agent's work silently disappears, and because both reported success the supervisor believes both landed. The version that survives is decided by scheduling, so the same run produces different outcomes on different days with no change to anything anyone can see.

discharges: [AAC-0066, AAC-0038, AAC-0040]

design_decisions:
  - question: Shared mutable state, or message passing?
    tension: >-
      Shared state is convenient and reintroduces every concurrency problem the
      delegation boundary was supposed to remove. Message passing avoids them
      and forces the supervisor to hold and reconcile everything itself.
    resolution: >-
      Message passing by default; shared state only where the volume makes
      copying genuinely impractical, and then with a single writer.
  - question: How are contradictory sub-results reconciled?
    tension: >-
      Asking a model to reconcile is flexible and can average two answers into a
      third that neither agent would defend. Deterministic precedence rules are
      predictable and cannot handle a genuine disagreement about facts.
    resolution: >-
      Surface the contradiction rather than resolving it silently. A
      reconciliation nobody can point at is a fabrication with extra steps.
  - question: Is the state scoped to the run?
    tension: >-
      Run-scoped state is isolated and loses anything worth keeping. Persistent
      shared state accumulates and becomes a cross-tenant boundary that must
      then be enforced.

realization_policy: own

see_also: [AHC-0044, AHC-0047, AHC-0069]
