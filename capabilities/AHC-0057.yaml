# AHC-0057 — Irreversible actions require an approval the run cannot grant
id: AHC-0057
status: active
since: "0.2.0"

level: MUST
layers: [L14]
positions: [P8, P5]

concern: safety
facet: operational constraint

archetypes: [A9, A6, A7]
core: false

title: |-
  Irreversible actions require an approval the run cannot grant

requirement: |-
  Actions in the irreversible class from AHC-0039 are held pending an approval issued by a principal outside the run, naming the specific action and resource, unless the specification states the conditions under which the agent holds that authority itself — conditions over declared state, checked by the system on which the effect lands, never a judgement the model makes; a check made only on the harness side of the call does not meet this. An action taken under a person's approval carries the identity of that approval to the executing system, which loads it — from a place the binding names — and confirms it names this action, these arguments and this resource before acting. The run has no tool, argument or instruction path by which it can approve itself or widen those conditions, and a pending action that is never approved expires rather than proceeding. The approval also records the state its assessment judged, and that state is re-established immediately before the action executes; where it has changed the action does not proceed and the decision is sought again against what is now true.

failure_mode: |-
  Where approval is a step the agent performs — a self-check, a confidence threshold, a reflection prompt — it is subject to the same reasoning that proposed the action, and to any instruction that reached the model through retrieved content or tool output. An approval the run can grant is not a control; it is a delay that produces an audit trail suggesting there was one.

  The second failure needs no compromised model and survives every other control on the path. An approval is the one place in a system where a human interval separates reading a row from acting on it, and the expiry window is satisfied by a decision made a minute ago. Where the effect's magnitude is a field on the resource rather than an argument on the call — a refund for an order's total, a transfer of an account's balance — the approver and the executing call read it separately, minutes or hours apart, and an argument-by-argument check between them compares values that both agree on while the value that matters moved. A person approves one amount and another leaves.

discharges: [AAC-0078, AAC-0056, AAC-0081]

design_decisions:
  - question: What does the approver actually see?
    tension: >-
      Showing the full trajectory is complete and takes longer to read than the
      approver will spend, so approvals become reflexive. Showing a summary is
      readable and is generated by the same system asking for permission.
    resolution: >-
      Show the concrete effect — resource, operation, before and after — rather
      than the reasoning. The approver is checking the action, not the argument.
  - question: What happens while the action is pending?
    tension: >-
      Holding the run open preserves context and holds resources for an
      unbounded human interval. Suspending and resuming from a checkpoint is
      efficient and needs the state machinery of AHC-0044 to be sound.
  - key: irreversible_scope
    question: Does every irreversible action need a person?
    tension: >-
      Requiring one for each is the defensible reading and puts a human in front
      of routine work, so the desk becomes the bottleneck for the commonest
      request and people route around the control. Exempting a class by
      judgement at the time of acting is exactly the self-approval this
      capability exists to remove.
    resolution: >-
      Irreversibility is a property of the system; recoverability is a property
      of the person. An effect the requester can bring about again through the
      system's ordinary operations — an order cancelled and placed afresh — is
      irreversible to the system and recoverable to them. An effect that moves
      value, or that they cannot re-create, is neither. Where the two differ the
      specification states the authority as conditions over declared state, and
      the harness checks them where the action executes. What is never
      acceptable is the agent deciding at the time which of the two it is
      looking at.
  - key: approval_staleness
    question: Which state has to still hold when a grant is executed?
    tension: >-
      Comparing the whole resource is the complete reading and fails grants for
      fields that move by themselves — a day counter, a last-seen timestamp — so
      the control fires on changes nobody judged and is switched off. Comparing
      nothing is what every system does by default and is how an approved amount
      and an executed amount come to differ.
    resolution: >-
      The fields the assessment's own decision depended on, named by the
      assessment because it is what read them, and compared as recorded rather
      than as re-parsed. A field that was recorded and can no longer be read
      counts as changed: a check that cannot see the fact it is checking must
      not conclude the fact is unchanged.
  - key: stale_grant
    question: A grant that has gone stale — retry, or ask again?
    tension: >-
      Re-assessing automatically keeps the customer moving and quietly converts
      one person's decision about one situation into standing permission over
      whatever the situation becomes. Asking again is slower and is the only
      reading under which the approver decided the thing they were shown.
    resolution: >-
      Ask again. Nothing was attempted, so there is no half-finished effect to
      reconcile, and the outcome is reported as its own kind rather than as a
      failure — a failure asks an operator to find what broke, and here nothing
      did. The record of approvals therefore has a value for it — granted,
      and not executed because what it judged had moved — distinct from
      refused, expired and failed, and the request sought again names the one
      it replaces.
  - key: grant_carriage
    question: How does the system that executes an action know it was approved?
    tension: >-
      Adding a scope to the caller's identity when a grant is issued is simple
      and turns one approval of one action into a credential that can perform
      any action of that kind, for as long as it lives — and the scope is one
      the agent's own side added. Carrying the approval with the call makes the
      executing system read the approval record, which it must be able to reach.
    resolution: >-
      The call names the approval that elevated it, and the executing system
      loads that approval and confirms it matches the operation, the arguments
      and the resource before acting, rejecting the call otherwise. Where the
      party executing a grant has no customer of its own — a workflow acting an
      hour after the person asked — the approval says whose the call is, which
      is a different check and not a weaker one: the record it reads is the one
      that must already match in every other respect. The agent's own authority
      conditions are checked in the same place, against the live resource, so a
      harness that skipped them still cannot cause the effect.
  - key: approval_source
    question: Where does the executing system read an approval from?
    tension: >-
      Approvals are the harness's records and the check belongs to another
      system. Passing the approval inside the call is self-contained and has
      the executing side trust a record the caller's side produced and could
      alter. Reading the harness's store makes the check real and couples two
      systems through one store — a coupling that exists whether or not
      anybody writes it down.
    resolution: >-
      From a store the harness writes and the executing system can only read,
      named in the binding. The call carries a reference to the approval,
      never the record itself.
  - question: Is there a standing pre-approval for routine cases?
    tension: >-
      Pre-approving common actions keeps throughput and recreates the standing
      permission this capability exists to remove.
    resolution: >-
      Scope any pre-approval to a resource pattern and a time window, and record
      each use against it. "This class is always fine" is how the control decays.

realization_policy: own

see_also: [AHC-0039, AHC-0054, AHC-0058]
