# AHC-0057 — Irreversible actions require an approval the run cannot grant
id: AHC-0057
status: active
since: "0.2.0"

level: MUST
layers: [L14]
positions: [P8, P5]

archetypes: [A9, A6, A7]
core: false

title: |-
  Irreversible actions require an approval the run cannot grant

requirement: |-
  Actions in the irreversible class from AHC-0039 are held pending an approval issued by a principal outside the run, naming the specific action and resource, unless the specification states the conditions under which the agent holds that authority itself — conditions over declared state, checked where the action executes, never a judgement the model makes. The run has no tool, argument or instruction path by which it can approve itself or widen those conditions, and a pending action that is never approved expires rather than proceeding.

failure_mode: |-
  Where approval is a step the agent performs — a self-check, a confidence threshold, a reflection prompt — it is subject to the same reasoning that proposed the action, and to any instruction that reached the model through retrieved content or tool output. An approval the run can grant is not a control; it is a delay that produces an audit trail suggesting there was one.

discharges: [AAC-0078, AAC-0056, AAC-0081]

design_decisions:
  - question: What does the approver actually see?
    tension: >-
      Showing the full trajectory is complete and takes longer to read than the
      approver will spend, so approvals become reflexive. Showing a summary is
      readable and is generated by the same system asking for permission.
    resolution: >-
      Show the concrete effect — resource, operation, before and after — rather
      than the reasoning. The approver is checking the action, not the argument.
  - question: What happens while the action is pending?
    tension: >-
      Holding the run open preserves context and holds resources for an
      unbounded human interval. Suspending and resuming from a checkpoint is
      efficient and needs the state machinery of AHC-0044 to be sound.
  - question: Does every irreversible action need a person?
    tension: >-
      Requiring one for each is the defensible reading and puts a human in front
      of routine work, so the desk becomes the bottleneck for the commonest
      request and people route around the control. Exempting a class by
      judgement at the time of acting is exactly the self-approval this
      capability exists to remove.
    resolution: >-
      Irreversibility is a property of the system; recoverability is a property
      of the person. An effect the requester can bring about again through the
      system's ordinary operations — an order cancelled and placed afresh — is
      irreversible to the system and recoverable to them. An effect that moves
      value, or that they cannot re-create, is neither. Where the two differ the
      specification states the authority as conditions over declared state, and
      the harness checks them where the action executes. What is never
      acceptable is the agent deciding at the time which of the two it is
      looking at.
  - question: Is there a standing pre-approval for routine cases?
    tension: >-
      Pre-approving common actions keeps throughput and recreates the standing
      permission this capability exists to remove.
    resolution: >-
      Scope any pre-approval to a resource pattern and a time window, and record
      each use against it. "This class is always fine" is how the control decays.

realization_policy: own

see_also: [AHC-0039, AHC-0054, AHC-0058]
