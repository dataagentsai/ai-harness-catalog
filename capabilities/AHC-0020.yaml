# AHC-0020 — Concurrency is bounded by the harness, not by the runtime
id: AHC-0020
status: active
since: "0.2.0"

level: MUST
layers: [L8]
positions: [P3, P2]

concern: performance-efficiency
facet: capacity

archetypes: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
core: true

title: |-
  Concurrency is bounded by the harness, not by the runtime

requirement: |-
  The number of model calls in flight is limited by an explicit control the harness owns, and work beyond that limit queues with a bounded wait rather than being issued. The limit exists whether or not the runtime happens to impose one, and it is expressed in the same unit the provider throttles on. The limit is a number the profile sets; a profile without it is incomplete rather than defaulted.

failure_mode: |-
  Where the only limit is how many tasks the runtime will schedule, a burst issues every call at once, the provider throttles, and the retry logic converts one burst into several. Latency then collapses for every caller including the ones who arrived before the burst, and the system's behaviour under load is decided by a thread pool size nobody chose for this purpose.

discharges: [AAC-0007, AAC-0009]

design_decisions:
  - question: Bound by requests, or by tokens in flight?
    tension: >-
      Requests are trivial to count and are a poor proxy: ten short calls and
      ten long ones consume vastly different provider capacity. Tokens track
      what is actually throttled and must be estimated before the call, since
      the true count is only known after it.
  - question: Queue, or shed?
    tension: >-
      Queueing preserves work and turns overload into unbounded latency, which
      users experience as a hang. Shedding is honest, fast to recover from and
      discards work someone wanted.
    resolution: >-
      Bounded queue with a wait ceiling, then shed. An unbounded queue is a
      latency incident that has not happened yet.
  - question: Is the limit per process or global?
    tension: >-
      Per process is simple and multiplies by however many replicas are running,
      so autoscaling silently raises the effective limit at the worst moment.
      Global is accurate and needs shared state on the request path.

realization_policy: own

see_also: [AHC-0021, AHC-0030]
