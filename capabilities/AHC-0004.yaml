# AHC-0004 — One choke point for every model call
# Normative. Edit here; anything rendered is generated from this file.
id: AHC-0004
status: active
since: "0.1.0"

level: MUST
layers: [L2]
positions: [P3, P2]

concern: maintainability
facet: modularity

archetypes: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
core: true

title: |-
  One choke point for every model call

requirement: |-
  Every model invocation in the system passes through a single component. Provider SDKs are constructed in that one place and nowhere else, and the set of reachable models is enumerable from it. Code that calls a provider directly is a defect of the same class as code that opens its own database connection.

failure_mode: |-
  Once a second call path exists, every subsequent capability in this catalog acquires a hole. Cost accounting undercounts, spans go missing, the policy point is bypassed, and the model allow-list is advisory. The hole is usually opened by a library, a notebook, or a well-meaning fix under time pressure — and it is discovered by a total that does not reconcile.

discharges: [AAC-0011, AAC-0100, AAC-0098, AAC-0094]

design_decisions:
  - key: choke_point
    question: In-process choke point, gateway, or both?
    tension: >-
      In-process sees types, caller identity and business context, but governs
      only code that imports it — which excludes other languages and any vendor
      component. A gateway covers everything on the network path and knows none
      of that context. Running both means two places to change and two to keep
      consistent.
    resolution: >-
      Both, with the split made explicit: the harness owns anything needing
      application context, the gateway owns anything that must hold for callers
      you do not control. Write the split down; the failure mode is each side
      assuming the other did it.
  - key: sdk_containment
    question: How is direct-SDK usage kept out?
    tension: >-
      Convention decays under deadline. Enforcement — a lint rule, an import
      ban, egress restricted so only the choke point can reach the provider —
      costs setup and will occasionally block something legitimate.
    resolution: >-
      Enforce at the network boundary where possible. A convention with no
      mechanism behind it is a comment.
  - key: interface_shape
    question: Does the choke point expose the provider's native interface, or its own?
    tension: >-
      Passing through the native interface is cheap and keeps provider features
      reachable the day they ship. Its own interface makes the provider
      swappable and gives one place to put the typed contract, at the cost of
      lagging behind whatever the provider adds next.

realization_policy: own

see_also: [AHC-0006, AHC-0007, AHC-0008]
